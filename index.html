          { sira: 5, baslik: "Aylık Vergi Farkı" },
          { sira: 6, baslik: "Kendi Kendine Deneme" },
          { sira: 7, baslik: "Serbest Hesaplama Aracı" },
        ];

        const [aktifDers, setAktifDers] = useState(1);
        const [tamamlananDersler, setTamamlananDersler] = useState([1]);

        // Ders 1 Etkileşim Durumu
        const [ders1Secim, setDers1Secim] = useState(null);

        // Ders 2 Seçili Dilim Detayı
        const [seciliDilimId, setSeciliDilimId] = useState(2);

        // Ders 3 Aylık Matrah Simülatörü (12 Ay)
        const [aylikMatrahHam, setAylikMatrahHam] = useState("30000");
        const aylikMatrahKontrol = parsePozitifSayi(aylikMatrahHam);
        const aylikMatrahDeger = aylikMatrahKontrol.gecerli ? aylikMatrahKontrol.deger : 0;

        // Ders 4 Dağılım Örneği (Varsayılan 210.000 TL)
        const [ders4MatrahHam, setDers4MatrahHam] = useState("210000");
        const ders4Kontrol = parsePozitifSayi(ders4MatrahHam);
        const ders4Matrah = ders4Kontrol.gecerli ? ders4Kontrol.deger : 0;

        // Ders 5 Önceki & Cari Ay Örneği (Varsayılan 180.000 + 30.000)
        const [ders5OncekiHam, setDers5OncekiHam] = useState("180000");
        const [ders5CariHam, setDers5CariHam] = useState("30000");
        const ders5OncekiKontrol = parsePozitifSayi(ders5OncekiHam);
        const ders5CariKontrol = parsePozitifSayi(ders5CariHam);
        const ders5Onceki = ders5OncekiKontrol.gecerli ? ders5OncekiKontrol.deger : 0;
        const ders5Cari = ders5CariKontrol.gecerli ? ders5CariKontrol.deger : 0;

        // Ders 6 Quiz + Uygulamalı Hesap Alıştırması
        const [quizYanitlari, setQuizYanitlari] = useState({});
        const [alistirmaYanitHam, setAlistirmaYanitHam] = useState("");
        const [alistirmaKontrolEdildi, setAlistirmaKontrolEdildi] = useState(false);

        // Ders 7 Serbest Hesaplama Aracı
        const [serbestOncekiHam, setSerbestOncekiHam] = useState("180000");
        const [serbestCariHam, setSerbestCariHam] = useState("30000");
        const [uyarilarAcik, setUyarilarAcik] = useState(false);

        const serbestOncekiKontrol = parsePozitifSayi(serbestOncekiHam);
        const serbestCariKontrol = parsePozitifSayi(serbestCariHam);
        const serbestOnceki = serbestOncekiKontrol.gecerli ? serbestOncekiKontrol.deger : 0;
        const serbestCari = serbestCariKontrol.gecerli ? serbestCariKontrol.deger : 0;

        const derseGit = (sira) => {
          setAktifDers(sira);
          if (!tamamlananDersler.includes(sira)) {
            setTamamlananDersler((prev) => [...prev, sira]);
          }
        };

        const ilerlemeYuzde = Math.round((tamamlananDersler.length / dersBolumleri.length) * 100);

        // Ders 3: 12 Aylık Kümülatif Tablo + Dilim Geçiş Analizi
        const yillikTablo = useMemo(() => {
          let birikenMatrahKurus = 0;
          let oncekiVergiKurus = 0;
          const aylikKurus = toKurus(aylikMatrahDeger);

          return AYLAR.map((ay) => {
            const oncekiMatrahKurus = birikenMatrahKurus;
            birikenMatrahKurus += aylikKurus;
            const yeniVergiKurus = kumulatifVergiHesaplaKurus(birikenMatrahKurus);
            const buAyVergiKurus = yeniVergiKurus - oncekiVergiKurus;
            oncekiVergiKurus = yeniVergiKurus;

            const oncekiTL = fromKurus(oncekiMatrahKurus);
            const aylikTL = fromKurus(aylikKurus);
            const birikenTL = fromKurus(birikenMatrahKurus);

            let aktifDilim = VERGI_TARIFESI.dilimler[0];
            for (const d of VERGI_TARIFESI.dilimler) {
              if (birikenTL > d.altSinir) {
                aktifDilim = d;
              }
            }

            let oncekiDilim = VERGI_TARIFESI.dilimler[0];
            for (const d of VERGI_TARIFESI.dilimler) {
              if (oncekiTL > d.altSinir) {
                oncekiDilim = d;
              }
            }

            const cariParcalar = cariAyDilimDagilimi(oncekiTL, aylikTL).filter((d) => d.aktif);
            const kumulatifParcalar = kumulatifDilimDagilimi(birikenTL).filter((d) => d.aktif);
            const gecisVarMi = cariParcalar.length > 1 || (oncekiTL > 0 && oncekiDilim.id !== aktifDilim.id);
            const gecisMetni =
              cariParcalar.length > 1
                ? cariParcalar.map((p) => p.oranYuzde).join(' → ')
                : gecisVarMi
                  ? `${oncekiDilim.oranYuzde} → ${aktifDilim.oranYuzde}`
                  : null;

            return {
              ay,
              oncekiMatrah: oncekiTL,
              aylikMatrah: aylikTL,
              kumulatifMatrah: birikenTL,
              kumulatifVergi: fromKurus(yeniVergiKurus),
              aylikVergi: fromKurus(buAyVergiKurus),
              aktifDilim,
              oncekiDilim,
              cariParcalar,
              kumulatifParcalar,
              gecisVarMi,
              gecisMetni,
            };
          });
        }, [aylikMatrahDeger]);

        // Ders 5 Hesaplamaları
        const ders5YeniMatrah = ders5Onceki + ders5Cari;
        const ders5OncekiVergi = kumulatifVergiHesapla(ders5Onceki);
        const ders5YeniVergi = kumulatifVergiHesapla(ders5YeniMatrah);
        const ders5AylikVergi = fromKurus(kumulatifVergiHesaplaKurus(toKurus(ders5YeniMatrah)) - kumulatifVergiHesaplaKurus(toKurus(ders5Onceki)));
        const ders5CariDilimler = cariAyDilimDagilimi(ders5Onceki, ders5Cari).filter((d) => d.aktif);

        // Ders 6 Uygulamalı Alıştırma (Senaryo: Önceki 380.000 TL, Cari Ay 40.000 TL -> Yeni 420.000 TL)
        // 380.000 -> %15 (190k * 0.15 = 28.500) + %20 (190k * 0.20 = 38.000) = 66.500 TL
        // 420.000 -> 400k (70.500) + 20k * 0.27 (5.400) = 75.900 TL
        // Cari Ay Farkı: 75.900 - 66.500 = 9.400 TL (20.000 * 0.20 = 4.000 + 20.000 * 0.27 = 5.400)
        const alistirmaBeklenen = 9400;
        const alistirmaSayi = parsePozitifSayi(alistirmaYanitHam);
        const alistirmaDogru = alistirmaKontrolEdildi && alistirmaSayi.gecerli && !alistirmaSayi.bos && Math.abs(alistirmaSayi.deger - alistirmaBeklenen) < 0.01;

        // Ders 7 Serbest Hesaplama Sonuçları
        const serbestYeniMatrah = serbestOnceki + serbestCari;
        const serbestOncekiVergiKurus = kumulatifVergiHesaplaKurus(toKurus(serbestOnceki));
        const serbestYeniVergiKurus = kumulatifVergiHesaplaKurus(toKurus(serbestYeniMatrah));
        const serbestAylikVergiKurus = serbestYeniVergiKurus - serbestOncekiVergiKurus;

        const serbestOncekiVergi = fromKurus(serbestOncekiVergiKurus);
        const serbestYeniVergi = fromKurus(serbestYeniVergiKurus);
        const serbestAylikVergi = fromKurus(serbestAylikVergiKurus);
        const serbestCariDagilim = cariAyDilimDagilimi(serbestOnceki, serbestCari);

        const seciliDilim = VERGI_TARIFESI.dilimler.find((d) => d.id === seciliDilimId) || VERGI_TARIFESI.dilimler[0];

        return (
          <div className="flex flex-col gap-6">
            {/* Ders Başlığı, Kısa Açıklama ve İlerleme Göstergesi */}
            <section className="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col gap-5">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div className="max-w-2xl">
                  <div className="text-xs text-sky-400 font-medium">Etkileşimli Eğitim Modülü · 7 Aşama</div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white mt-1" style={{ textWrap: 'balance' }}>
                    Gelir Vergisi Akademisi
                  </h2>
                  <p className="text-sm text-slate-300 mt-1.5 leading-relaxed">
                    Gelir vergisi matrahının kümülatif ilerleyişini, artan oranlı vergi dilimlerinin nasıl uygulandığını ve cari ay vergisinin iki kümülatif vergi arasındaki farktan nasıl bulunduğunu adım adım öğrenin.
                  </p>
                </div>

                <div className="w-full md:w-64 shrink-0 bg-slate-950 border border-slate-800 rounded-lg p-3.5">
                  <div className="flex items-center justify-between text-xs mb-2">
                    <span className="text-slate-400">Ders İlerlemesi</span>
                    <span className="font-mono tabular-nums font-semibold text-sky-300">
                      {tamamlananDersler.length} / {dersBolumleri.length} (%{ilerlemeYuzde})
                    </span>
                  </div>
                  <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                    <div
                      className="h-full bg-sky-500 transition-all duration-200"
                      style={{ width: `${ilerlemeYuzde}%` }}
                    />
                  </div>
                </div>
              </div>

              {/* Aşama Sekmeleri */}
              <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2 pt-2 border-t border-slate-800">
                {dersBolumleri.map((b) => {
                  const aktif = aktifDers === b.sira;
                  const goruldu = tamamlananDersler.includes(b.sira);
                  return (
                    <button
                      key={b.sira}
                      onClick={() => derseGit(b.sira)}
                      className={`px-3 py-2.5 rounded-lg border text-left transition-colors cursor-pointer min-h-[44px] flex flex-col justify-between gap-1 ${
                        aktif
                          ? 'bg-sky-600/20 border-sky-500 text-white'
                          : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center justify-between text-[11px] font-mono text-slate-400">
                        <span>0{b.sira}</span>
                        {goruldu && <IconCheck className="w-3.5 h-3.5 text-emerald-400 shrink-0" />}
                      </div>
                      <span className="text-xs font-semibold leading-snug line-clamp-2">{b.baslik}</span>
                    </button>
                  );
                })}
              </div>
            </section>

            {/* ============================================================== */}
            {/* AŞAMA 1: TEMEL KAVRAMLAR VE MANTIK */}
            {/* ============================================================== */}
            {aktifDers === 1 && (
              <div className="flex flex-col gap-6">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 sm:p-8 flex flex-col gap-6">
                  <div className="border-b border-slate-800 pb-5">
                    <div className="text-xs text-sky-400 font-medium">Bölüm 1 / 7 · Temel İlkeler</div>
                    <h3 className="text-xl sm:text-2xl font-bold text-white mt-1">Gelir Vergisinin Temel Mantığı ve Kavramlar</h3>
                    <p className="text-sm text-slate-300 mt-2 leading-relaxed max-w-3xl">
                      Gelir vergisi hesaplanırken ilgili dönem boyunca biriken kümülatif gelir vergisi matrahı dikkate alınır. Matrah farklı vergi dilimlerine girebilir ve her dilime denk gelen tutar kendi oranıyla hesaplanır.
                    </p>
                  </div>

                  {/* Ana Mesaj */}
                  <div className="bg-sky-950/30 border border-sky-500/40 rounded-xl p-5">
                    <div className="text-xs font-semibold text-sky-300">Temel Kural</div>
                    <p className="text-base font-semibold text-white mt-1">
                      Üst vergi dilimine geçmek, matrahın tamamının üst oranla vergilendirileceği anlamına gelmez.
                    </p>
                  </div>

                  {/* Etkileşimli Hızlı Kontrol (250.000 TL sorusu) */}
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 flex flex-col gap-4">
                    <h4 className="text-sm font-semibold text-white">
                      Kavram Kontrolü: Kümülatif matrahı 250.000,00 TL olan bir çalışanın tüm matrahı mı, yoksa dilimlere ayrılan bölümleri mi farklı oranlarla vergilendirilir?
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <button
                        onClick={() => setDers1Secim('tek')}
                        className={`p-3.5 rounded-lg border text-left text-sm transition-colors cursor-pointer min-h-[44px] ${
                          ders1Secim === 'tek'
                            ? 'bg-rose-950/40 border-rose-500 text-rose-200'
                            : 'bg-slate-900 border-slate-800 text-slate-200 hover:border-slate-700'
                        }`}
                      >
                        250.000,00 TL'nin tamamı tek bir üst oran (%20) ile vergilendirilir.
                      </button>
                      <button
                        onClick={() => setDers1Secim('dilim')}
                        className={`p-3.5 rounded-lg border text-left text-sm transition-colors cursor-pointer min-h-[44px] ${
                          ders1Secim === 'dilim'
                            ? 'bg-emerald-950/40 border-emerald-500 text-emerald-200'
                            : 'bg-slate-900 border-slate-800 text-slate-200 hover:border-slate-700'

                      >
                        Matrah dilimlere ayrılır: ilk 190.000,00 TL %15 ile, kalan 60.000,00 TL %20 ile vergilendirilir.
                      </button>
                    </div>

                    {ders1Secim === 'tek' && (
                      <div className="bg-rose-950/30 border border-rose-500/50 rounded-lg p-4 text-xs text-rose-200 flex items-start gap-2.5">
                        <IconX />
                        <div>
                          <span className="font-semibold block">Yanlış yöntem: Tüm matraha tek oran uygulanmaz.</span>
                          <p className="mt-1 text-slate-300">
                            Doğru yöntem kademeli (artan oranlı) hesaplamadır. 250.000,00 TL'nin ilk 190.000,00 TL'lik bölümü %15 diliminde (28.500,00 TL vergi) kalır; yalnızca 190.000,00 TL'yi aşan 60.000,00 TL'lik kısım %20 oranında (12.000,00 TL vergi) hesaplanır.
                          </p>
                        </div>
                      </div>

                    {ders1Secim === 'dilim' && (

                        <IconCheck />
                        <div>
                          <span className="font-semibold block">Doğru tespit!</span>
                          <p className="mt-1 text-slate-300">
                            İlk 190.000,00 TL × %15 = 28.500,00 TL ve kalan 60.000,00 TL × %20 = 12.000,00 TL olmak üzere toplam kümülatif vergi 40.500,00 TL olur.
                          </p>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* 5 Temel Kavram */}
                  <div>
                    <h4 className="text-base font-semibold text-white mb-3">Temel Kavramlar Sözlüğü</h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {TEMEL_KAVRAMLAR.map((k, idx) => (
                        <div key={idx} className="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col justify-between gap-2">
                          <div>
                            <div className="text-sm font-semibold text-white">{k.terim}</div>
                            <p className="text-xs text-slate-300 mt-1.5 leading-relaxed">{k.aciklama}</p>
                          </div>
                          {k.formul && (
                            <div className="mt-2 pt-2 border-t border-slate-800/80 font-mono text-xs text-sky-300">
                              {k.formul}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Öğrenme Hedefleri */}
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-5">
                    <h4 className="text-sm font-semibold text-white mb-3">Bu Akademiyi Tamamladığınızda Kazanacaklarınız</h4>
                    <ul className="grid grid-cols-1 md:grid-cols-2 gap-2.5 text-xs text-slate-300">
                      {OGRENME_HEDEFLERI.map((hedef, idx) => (
                        <li key={idx} className="flex items-start gap-2">
                          <span className="font-mono text-sky-400 font-semibold shrink-0">0{idx + 1}.</span>
                          <span>{hedef}</span>
                        </li>
                      ))}

                  </div>

                  <div className="flex justify-end pt-4 border-t border-slate-800">
                    <button
                      onClick={() => derseGit(2)}
                      className="flex items-center gap-2 px-6 py-2.5 rounded-lg font-semibold text-sm bg-sky-600 hover:bg-sky-500 text-white transition-colors cursor-pointer min-h-[44px]"
                    >
                      <span>Sonraki Bölüm: Vergi Dilimlerini Tanı</span>
                      <IconArrowRight />
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ============================================================== */}
            {/* AŞAMA 2: VERGİ DİLİMLERİNİ TANI */}
            {/* ============================================================== */}
            {aktifDers === 2 && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 sm:p-8 flex flex-col gap-6">
                <div className="border-b border-slate-800 pb-5">
                  <div className="text-xs text-sky-400 font-medium">Bölüm 2 / 7 · Tarife Yapısı</div>
                  <h3 className="text-xl sm:text-2xl font-bold text-white mt-1">Vergi Dilimlerini Tanı</h3>
                  <p className="text-sm text-slate-300 mt-1 max-w-3xl">
                    Aşağıdaki eğitim tarifesinde yer alan her bir vergi dilimine tıklayarak o dilimde vergilendirilebilecek azami tutarı, devreden vergi toplamını ve örnek hesaplamayı inceleyin.
                  </p>
                </div>

                {/* Dilim Seçim Kartları */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                  {VERGI_TARIFESI.dilimler.map((d) => {
                    const secili = seciliDilimId === d.id;
                    const dilimGenislik = d.ustSinir === null ? null : d.ustSinir - d.altSinir;
                    return (
                      <button
                        key={d.id}
                        onClick={() => setSeciliDilimId(d.id)}
                        className={`p-4 rounded-xl border text-left transition-colors cursor-pointer flex flex-col justify-between gap-3 ${
                          secili
                            ? `${d.softBgClass} ${d.borderClass} ring-1 ring-white/20`
                            : 'bg-slate-950 border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        <div>
                          <div className="flex items-center justify-between gap-2">
                            <span className={`w-4 h-4 rounded shrink-0 ${d.barClass}`} aria-hidden="true" />
                            <span className={`font-mono font-extrabold text-lg ${d.textClass}`}>{d.oranYuzde}</span>
                          </div>
                          <div className="text-sm font-bold text-white mt-2">{d.ad}</div>
                          <div className="text-xs font-mono tabular-nums text-slate-200 mt-1">
                            {formatTL(d.altSinir)} – {d.ustSinir === null ? 'Üzeri' : formatTL(d.ustSinir)}
                          </div>
                        </div>

                        <div className="pt-2 border-t border-slate-800/80 text-xs font-mono tabular-nums text-slate-200">
                          <div>Önceki vergi: {formatTL(d.oncekiDilimlerVergiToplami)}</div>
                          <div className="text-slate-300 mt-0.5">
                            Dilim payı: {dilimGenislik === null ? 'Sınırsız' : formatTL(dilimGenislik)}
                          </div>

                      </button>
                    );
                  })}
                </div>

                {/* İnteraktif Vergi Dilimi Dağılım Çubuğu (%15 mavi, %20 yeşil vb.) */}
                {(() => {
                  const secilenOrnek = seciliDilim.ornekMatrah;
                  const dagilimListesi = kumulatifDilimDagilimi(secilenOrnek);
                  const aktifParcalar = dagilimListesi.filter(d => d.vergilendirilenTutar > 0);
                  const referansGenislik = secilenOrnek > 0 ? secilenOrnek : 190000;

                  return (
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 flex flex-col gap-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div>
                          <h4 className="text-sm sm:text-base font-semibold text-white">
                            Örnek Matrah Dağılım Çubuğu ({seciliDilim.ad} — {formatTL(secilenOrnek)})
                          </h4>
                          <p className="text-xs sm:text-sm text-slate-300 mt-0.5">
                            Her dilim kendi rengiyle (%15 mavi, %20 yeşil, %27 sarı, %35 turuncu, %40 kırmızı) matrahın içindeki payını gösterir.
                          </p>
                        </div>
                        <div className="font-mono tabular-nums text-sm text-emerald-300 font-bold">
                          Toplam Vergi: {formatTL(kumulatifVergiHesapla(secilenOrnek))}
                        </div>
                      </div>

                      {/* Yığılmış Çubuk (Stacked Bar) */}
                      <div className="w-full h-12 bg-slate-900 border border-slate-700 rounded-lg overflow-hidden flex">
                        {aktifParcalar.map((d) => {
                          const yuzde = (d.vergilendirilenTutar / referansGenislik) * 100;
                          return (
                            <div
                              key={d.id}
                              style={{ width: `${yuzde}%` }}
                              className={`${d.barClass} h-full flex items-center justify-center px-2 text-slate-950 font-extrabold text-xs sm:text-sm border-r border-slate-950/40 last:border-r-0 transition-all duration-200 overflow-hidden`}
                              title={`${d.ad}: ${formatTL(d.vergilendirilenTutar)} (${d.oranYuzde})`}
                            >
                              {yuzde >= 12 ? (
                                <span className="truncate font-mono tabular-nums">{d.oranYuzde}</span>
                              ) : null}
                            </div>
                          );
                        })}
                      </div>

                      {/* Parça Detay Etiketleri */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
                        {dagilimListesi.map((d) => (
                          <div
                            key={d.id}
                            className={`rounded-lg border p-3.5 ${
                              d.aktif ? `${d.softBgClass} ${d.borderClass}` : 'bg-slate-900/40 border-slate-800 opacity-55'
                            }`}
                          >
                            <div className="flex items-center justify-between gap-2">
                              <div className="flex items-center gap-2">
                                <span className={`w-3.5 h-3.5 rounded ${d.barClass}`} aria-hidden="true" />
                                <span className="text-sm font-bold text-white">{d.oranYuzde}</span>
                              </div>
                              <span className="text-xs font-mono text-slate-300">
                                {d.aktif ? 'Aktif' : 'Boş'}
                              </span>
                            </div>
                            <div className="mt-2 font-mono tabular-nums text-sm text-white font-bold">

                    </label>
                    <div className="relative">
                      <input
                        id="serbest-cari"
                        type="text"
                        inputMode="decimal"
                        value={serbestCariHam}
                        onChange={(e) => setSerbestCariHam(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white font-mono tabular-nums font-bold text-lg text-right pr-12 focus:outline-none focus:ring-2 focus:ring-sky-500 min-h-[44px]"
                      />
                      <span className="absolute right-4 top-3.5 text-slate-400 text-xs font-mono">TL</span>
                    </div>
                    {!serbestCariKontrol.gecerli ? (
                      <p className="text-xs text-rose-400 mt-1.5">{serbestCariKontrol.hata}</p>
                    ) : (
                      <p className="text-xs text-slate-400 mt-1.5">Boş bırakılırsa 0,00 TL kabul edilir.</p>
                    )}
                  </div>
                </div>

                {/* 4 Sonuç Kartı: Yeni Matrah, Önceki Vergi, Yeni Vergi, Cari Ay Vergisi */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <div className="text-xs text-slate-400">Yeni Kümülatif Matrah</div>
                    <div className="text-lg font-mono tabular-nums font-bold text-white mt-1.5">{formatTL(serbestYeniMatrah)}</div>
                    <div className="text-[11px] font-mono text-slate-400 mt-1">
                      {formatSayi(serbestOnceki)} + {formatSayi(serbestCari)}
                    </div>
                  </div>

                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <div className="text-xs text-slate-400">Önceki Kümülatif Vergi</div>
                    <div className="text-lg font-mono tabular-nums font-bold text-slate-200 mt-1.5">{formatTL(serbestOncekiVergi)}</div>
                    <div className="text-[11px] text-slate-400 mt-1">Önceki aylarda biriken vergi</div>
                  </div>

                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <div className="text-xs text-slate-400">Yeni Kümülatif Vergi</div>
                    <div className="text-lg font-mono tabular-nums font-bold text-sky-300 mt-1.5">{formatTL(serbestYeniVergi)}</div>
                    <div className="text-[11px] text-slate-400 mt-1">Toplam kümülatif tutar</div>
                  </div>

                  <div className="bg-emerald-950/30 border border-emerald-500/60 rounded-xl p-4">
                    <div className="text-xs text-emerald-300 font-semibold">Bu Ayın Gelir Vergisi</div>
                    <div className="text-lg font-mono tabular-nums font-bold text-white mt-1.5">{formatTL(serbestAylikVergi)}</div>
                    <div className="text-[11px] font-mono text-emerald-300/90 mt-1">
                      Yeni vergi - Önceki vergi
                    </div>
                  </div>
                </div>

                {/* Yatay Dağılım Görseli */}
                <YatayDilimDagilimGorseli oncekiMatrah={serbestOnceki} cariMatrah={serbestCari} gosterOncekiAyrim={true} />

                {/* Cari Ay Matrahının Vergi Dilimlerine Dağılımı */}
                <div className="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
                  <div className="bg-slate-900 px-5 py-3 border-b border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <span className="text-sm font-semibold text-white">Cari Ay Matrahının Dilimlere Dağılımı</span>
                    <span className="text-xs font-mono tabular-nums text-emerald-300">
                      Cari Ay Toplamı: {formatTL(serbestCari)} → Vergi: {formatTL(serbestAylikVergi)}
                    </span>
                  </div>

                  <div className="divide-y divide-slate-800/80 text-xs sm:text-sm">
                    {serbestCariDagilim.map((d) => (
                      <div
                        key={d.id}
                        className={`px-5 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 ${
                          d.aktif ? 'text-slate-100' : 'text-slate-500'
                        }`}
                      >
                        <div className="flex items-center gap-2.5">
                          <span className={`w-2.5 h-2.5 rounded-sm shrink-0 ${d.barClass}`} aria-hidden="true" />
                          <span className="font-semibold">{d.ad}</span>
                          <span className="text-xs text-slate-400 font-mono">
                            ({formatTL(d.altSinir)} – {d.ustSinir === null ? 'Üzeri' : formatTL(d.ustSinir)})
                          </span>
                        </div>
                        <div className="font-mono tabular-nums text-right">
                          {d.aktif ? (
                            <span>
                              {formatTL(d.cariDilimTutar)} × {d.oranYuzde} = <strong className="text-white">{formatTL(d.cariDilimVergi)}</strong>
                            </span>
                          ) : (
                            <span>Bu dilime tutar girmedi (0,00 TL)</span>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Önemli Uyarılar (Açılır-Kapanır Bilgilendirme) */}
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                  <button
                    onClick={() => setUyarilarAcik((prev) => !prev)}
                    className="w-full flex items-center justify-between text-left text-xs font-semibold text-slate-200 cursor-pointer min-h-[36px]"
                  >
                    <span className="flex items-center gap-2">
                      <IconInfo />
                      <span>Önemli Metodoloji ve Eğitim Kapsamı Uyarıları</span>
                    </span>
                    <span className="text-sky-400">{uyarilarAcik ? 'Gizle' : 'Göster'}</span>
                  </button>
                  {uyarilarAcik && (
                    <ul className="mt-3 pt-3 border-t border-slate-800 space-y-2 text-xs text-slate-300 leading-relaxed list-disc pl-4">
                      {ONEMLI_UYARILAR.map((u, idx) => (
                        <li key={idx}>{u}</li>
                      ))}
                    </ul>
                  )}
                </div>

                <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                  <button
                    onClick={() => derseGit(6)}
                    className="flex items-center gap-2 px-5 py-2.5 rounded-lg font-semibold text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors cursor-pointer min-h-[44px]"
                  >
                    <IconArrowLeft />
                    <span>Önceki Bölüm</span>
                  </button>
                  <button
                    onClick={() => derseGit(1)}
                    className="px-5 py-2.5 rounded-lg font-semibold text-sm bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 transition-colors cursor-pointer min-h-[44px]"
                  >
                    Başa Dön (Bölüm 1)
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      // =========================================================================
      // MODÜLER TEMA KAYIT DEFTERİ VE UYGULAMA ALTYAPISI
      // Yeni bir tema eklemek için yalnızca TEMALAR dizisine yeni kayıt ekleyin.
      // =========================================================================
      const TEMA_DEGISKEN_ANAHTARLARI = [
        '--t-canvas', '--t-glow', '--t-header', '--t-card', '--t-inner',
        '--t-muted', '--t-hover', '--t-bar-prev', '--t-border', '--t-border-strong',
        '--t-text-1', '--t-text-2', '--t-text-3', '--t-text-4', '--t-text-5',
        '--t-accent', '--t-accent-hover', '--t-accent-fg', '--t-accent-text', '--t-accent-soft',
      ];

      const TEMALAR = [
        {
          id: 'varsayilan',
          ad: 'Gece Modu (Varsayılan)',
          kisa: 'Gece',
          swatch: 'rgb(15, 23, 42)',
          mod: 'varsayilan',
          vars: {},
        },
        {
          id: 'gunduz',
          ad: 'Gündüz Modu',
          kisa: 'Gündüz',
          swatch: 'rgb(248, 250, 252)',
          mod: 'aydinlik',
          vars: {
            '--t-canvas': '#f1f5f9',
            '--t-header': 'rgba(255, 255, 255, 0.92)',
            '--t-card': '#ffffff',
            '--t-inner': '#f8fafc',
            '--t-muted': '#e2e8f0',
            '--t-hover': '#cbd5e1',
            '--t-bar-prev': '#94a3b8',
            '--t-border': '#cbd5e1',
            '--t-border-strong': '#94a3b8',
            '--t-text-1': '#0f172a',
            '--t-text-2': '#1e293b',
            '--t-text-3': '#334155',
            '--t-text-4': '#475569',
            '--t-text-5': '#64748b',
            '--t-accent': '#0284c7',
            '--t-accent-hover': '#0369a1',
            '--t-accent-fg': '#ffffff',
            '--t-accent-text': '#0369a1',
            '--t-accent-soft': 'rgba(2, 132, 199, 0.12)',
          },
        },
        {
          id: 'pembe-canli',
          ad: 'Canlı Pembe · rgb(250, 105, 158)',
          kisa: 'Pembe 1',
          swatch: 'rgb(250, 105, 158)',
          mod: 'koyu-vurgu',
          vars: {
            '--t-canvas': '#16070f',
            '--t-glow': 'radial-gradient(ellipse at top, rgba(250, 105, 158, 0.24), transparent 60%)',
            '--t-header': 'rgba(22, 7, 15, 0.92)',
            '--t-card': '#260e1b',
            '--t-inner': '#13060d',
            '--t-muted': '#3d172c',
            '--t-hover': '#501f3a',
            '--t-border': 'rgba(250, 105, 158, 0.34)',
            '--t-border-strong': 'rgba(250, 105, 158, 0.52)',
            '--t-accent': 'rgb(250, 105, 158)',
            '--t-accent-hover': 'rgb(255, 134, 179)',
            '--t-accent-fg': '#240614',
            '--t-accent-text': 'rgb(255, 159, 199)',
            '--t-accent-soft': 'rgba(250, 105, 158, 0.18)',
          },
        },
        {
          id: 'pembe-seker',
          ad: 'Şeker Pembe · rgb(255, 159, 199)',
          kisa: 'Pembe 2',
          swatch: 'rgb(255, 159, 199)',
          mod: 'aydinlik',
          vars: {
            '--t-canvas': 'rgb(255, 159, 199)',
            '--t-header': 'rgba(255, 240, 247, 0.94)',
            '--t-card': '#fff6fa',
            '--t-inner': '#ffeaf3',
            '--t-muted': '#ffd4e6',
            '--t-hover': '#ffc0da',
            '--t-bar-prev': '#df8cb0',
            '--t-border': 'rgba(190, 24, 93, 0.26)',
            '--t-border-strong': 'rgba(190, 24, 93, 0.44)',
            '--t-text-1': '#260b18',
            '--t-text-2': '#3b1125',
            '--t-text-3': '#581c38',
            '--t-text-4': '#75274b',
            '--t-text-5': '#8c3b60',
            '--t-accent': '#db2777',
            '--t-accent-hover': '#be185d',
            '--t-accent-fg': '#ffffff',
            '--t-accent-text': '#9d174d',
            '--t-accent-soft': 'rgba(219, 39, 119, 0.14)',
          },
        },
        {
          id: 'pembe-pudra',
          ad: 'Pudra Pembe · rgb(255, 231, 240)',
          kisa: 'Pudra',
          swatch: 'rgb(255, 231, 240)',
          mod: 'aydinlik',
          vars: {
            '--t-canvas': 'rgb(255, 231, 240)',
            '--t-header': 'rgba(255, 248, 251, 0.94)',
            '--t-card': '#ffffff',
            '--t-inner': '#fff4f8',
            '--t-muted': '#ffe0ec',
            '--t-hover': '#ffcde0',
            '--t-bar-prev': '#e297b5',
            '--t-border': 'rgba(250, 105, 158, 0.36)',
            '--t-border-strong': 'rgba(219, 39, 119, 0.45)',
            '--t-text-1': '#24101a',
            '--t-text-2': '#3b1628',
            '--t-text-3': '#57213b',
            '--t-text-4': '#733050',
            '--t-text-5': '#8a4465',
            '--t-accent': 'rgb(250, 105, 158)',
            '--t-accent-hover': '#e64984',
            '--t-accent-fg': '#240614',
            '--t-accent-text': '#be185d',
            '--t-accent-soft': 'rgba(250, 105, 158, 0.18)',
          },
        },
        {
          id: 'nane-yesili',
          ad: 'Nane Yeşili · rgb(74, 221, 130)',
          kisa: 'Yeşil',
          swatch: 'rgb(74, 221, 130)',
          mod: 'koyu-vurgu',
          vars: {
            '--t-canvas': '#04130b',
            '--t-glow': 'radial-gradient(ellipse at top, rgba(74, 221, 130, 0.20), transparent 60%)',
            '--t-header': 'rgba(4, 19, 11, 0.92)',
            '--t-card': '#092216',
            '--t-inner': '#030f09',
            '--t-muted': '#103523',
            '--t-hover': '#174931',
            '--t-border': 'rgba(74, 221, 130, 0.30)',
            '--t-border-strong': 'rgba(74, 221, 130, 0.48)',
            '--t-accent': 'rgb(74, 221, 130)',
            '--t-accent-hover': 'rgb(112, 234, 158)',
            '--t-accent-fg': '#042010',
            '--t-accent-text': '#86efac',
            '--t-accent-soft': 'rgba(74, 221, 130, 0.16)',
          },
        },
      ];

      function temaUygula(temaId) {
        const secili = TEMALAR.find((t) => t.id === temaId) || TEMALAR[0];
        const root = document.documentElement;
        root.setAttribute('data-tema', secili.id);
        root.setAttribute('data-tema-mod', secili.mod);
        TEMA_DEGISKEN_ANAHTARLARI.forEach((k) => root.style.removeProperty(k));
        Object.entries(secili.vars || {}).forEach(([k, v]) => {
          root.style.setProperty(k, v);
        });
      }

      function TemaSecici({ tema, onSec }) {
        return (
          <div className="flex items-center gap-1.5 bg-slate-900/90 border border-slate-700 rounded-full px-2.5 py-1" role="group" aria-label="Tema Seçenekleri">
            <span className="text-[11px] font-semibold text-slate-300 pr-1 hidden md:inline">Tema:</span>
            {TEMALAR.map((t) => {
              const secili = tema === t.id;
              return (
                <button
                  key={t.id}
                  type="button"
                  onClick={() => onSec(t.id)}
                  title={t.ad}
                  aria-label={t.ad}
                  aria-pressed={secili}
                  style={{ backgroundColor: t.swatch }}
                  className={`w-6 h-6 rounded-full border transition-transform cursor-pointer flex items-center justify-center shrink-0 ${
                    secili
                      ? 'ring-2 ring-sky-400 ring-offset-2 ring-offset-slate-950 scale-110 border-white'
                      : 'border-slate-500/70 hover:scale-105'
                  }`}
                >
                  {t.id === 'varsayilan' && (
                    <span className="text-[10px] leading-none text-sky-300" aria-hidden="true">☾</span>
                  )}
                  {t.id === 'gunduz' && (
                    <span className="text-[11px] leading-none text-amber-500" aria-hidden="true">☀</span>
                  )}
                </button>
              );
            })}
          </div>
        );
      }

      function App() {
        const [aktifModul, setAktifModul] = useState('brutten-nete');
        const [tema, setTema] = useState(() => {
          try {
            return localStorage.getItem('bordro_akademisi_tema') || 'varsayilan';
          } catch {
            return 'varsayilan';
          }
        });

        useEffect(() => {
          temaUygula(tema);
          try {
            localStorage.setItem('bordro_akademisi_tema', tema);
          } catch {}
        }, [tema]);

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
            {/* 3 Bölgeli Üst Bar Sözleşmesi: Marka | Tek Satır Modül Linkleri | Tema & Birincil Aksiyon */}
            <header className="sticky top-0 z-30 bg-slate-950/90 backdrop-blur-md border-b border-slate-800">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3 sm:gap-6">
                {/* Bölge 1: Marka (Tek satır, alt başlıksız) */}
                <button
                  onClick={() => setAktifModul('brutten-nete')}
                  className="text-base sm:text-lg font-bold tracking-tight text-white whitespace-nowrap shrink-0 cursor-pointer text-left"
                >
                  Bordro Akademisi
                </button>

                {/* Bölge 2: Modül Gezinti Linkleri */}
                <nav className="flex items-center gap-4 sm:gap-6 text-xs sm:text-sm font-medium overflow-x-auto">
                  <button
                    onClick={() => setAktifModul('brutten-nete')}
                    className={`py-1.5 border-b-2 transition-colors whitespace-nowrap shrink-0 cursor-pointer ${
                      aktifModul === 'brutten-nete'
                        ? 'border-sky-500 text-white'
                        : 'border-transparent text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Temel Hesaplama Modülü
                  </button>
                  <button
                    onClick={() => setAktifModul('akademi')}
                    className={`py-1.5 border-b-2 transition-colors whitespace-nowrap shrink-0 cursor-pointer ${
                      aktifModul === 'akademi'
                        ? 'border-sky-500 text-white'
                        : 'border-transparent text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Gelir Vergisi Akademisi
                  </button>
                </nav>

                {/* Bölge 3: Tema Seçici + Tek Birincil Geçiş Butonu */}
                <div className="hidden sm:flex items-center gap-3 shrink-0">
                  <TemaSecici tema={tema} onSec={setTema} />
                  <button
                    onClick={() => setAktifModul(aktifModul === 'akademi' ? 'brutten-nete' : 'akademi')}
                    className="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700 transition-colors whitespace-nowrap shrink-0 cursor-pointer"
                  >
                    {aktifModul === 'akademi' ? 'Temel Hesaplamaya Geç' : 'Akademiye Geç'}
                  </button>
                </div>
              </div>
              {/* Mobil Tema Seçici Satırı */}
              <div className="sm:hidden border-t border-slate-800/80 px-4 py-2 flex items-center justify-between gap-2">
                <span className="text-[11px] font-semibold text-slate-400">
                  {TEMALAR.find((t) => t.id === tema)?.kisa || 'Tema'}
                </span>
                <TemaSecici tema={tema} onSec={setTema} />
              </div>
            </header>

            <main className="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full">
              {aktifModul === 'brutten-nete' ? <BruttenNeteModulu /> : <GelirVergisiAkademisi />}
            </main>

            <footer className="border-t border-slate-800/80 py-5 px-4 text-center text-xs text-slate-500">
              Bordro Akademisi · Temel Bordro, İşveren Maliyeti ve Kümülatif Gelir Vergisi Simülatörü
            </footer>
          </div>
        );
      }

      const rootEl = document.getElementById('root');
      if (ReactDOM.createRoot) {
        ReactDOM.createRoot(rootEl).render(<App />);
      } else {
        ReactDOM.render(<App />, rootEl);
      }
    </script>
  </body>
</html>
