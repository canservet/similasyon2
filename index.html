      // =========================================================================
      // KURUŞ BAZLI HESAPLAMA MOTORU VE TÜRKÇE SAYI BİÇİMLENDİRME
      // =========================================================================
      function toKurus(tl) {
        if (!Number.isFinite(tl) || tl < 0) return 0;
        return Math.round(tl * 100);
      }

      function fromKurus(kurus) {
        return kurus / 100;
      }

      function formatTL(tl) {
        const safe = Number.isFinite(tl) ? tl : 0;
        return new Intl.NumberFormat('tr-TR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(safe) + ' TL';
      }

      function formatSayi(tl) {
        const safe = Number.isFinite(tl) ? tl : 0;
        return new Intl.NumberFormat('tr-TR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(safe);
      }

      // Tek merkezi VERGI_TARIFESI veri yapısını kullanan kuruş hassasiyetli motor
      function kumulatifVergiHesaplaKurus(matrahKurus) {
        if (matrahKurus <= 0) return 0;
        let toplamVergiKurus = 0;
        for (const dilim of VERGI_TARIFESI.dilimler) {
          const altKurus = dilim.altSinir * 100;
          const ustKurus = dilim.ustSinir === null ? Infinity : dilim.ustSinir * 100;
          if (matrahKurus > altKurus) {
            const dilimdekiMatrahKurus = Math.min(matrahKurus, ustKurus) - altKurus;
            toplamVergiKurus += Math.round(dilimdekiMatrahKurus * dilim.oran);
          }
        }
        return toplamVergiKurus;
      }

      function kumulatifVergiHesapla(matrahTL) {
        return fromKurus(kumulatifVergiHesaplaKurus(toKurus(matrahTL)));
      }

      // Kümülatif matrahın tüm dilimlere dağılımı
      function kumulatifDilimDagilimi(matrahTL) {
        const matrahKurus = toKurus(matrahTL);
        return VERGI_TARIFESI.dilimler.map((dilim) => {
          const altKurus = dilim.altSinir * 100;
          const ustKurus = dilim.ustSinir === null ? Infinity : dilim.ustSinir * 100;
          const vergilendirilenKurus = matrahKurus > altKurus
            ? Math.max(0, Math.min(matrahKurus, ustKurus) - altKurus)
            : 0;
          const vergiKurus = Math.round(vergilendirilenKurus * dilim.oran);
          return {
            ...dilim,
            vergilendirilenTutar: fromKurus(vergilendirilenKurus),
            vergi: fromKurus(vergiKurus),
            aktif: vergilendirilenKurus > 0,
          };
        });
      }

      // Cari ay matrahının [onceki, onceki + cari] aralığında hangi dilimlere dağıldığı
      function cariAyDilimDagilimi(oncekiTL, cariTL) {
        const oncekiKurus = toKurus(oncekiTL);
        const yeniKurus = oncekiKurus + toKurus(cariTL);
        return VERGI_TARIFESI.dilimler.map((dilim) => {
          const altKurus = dilim.altSinir * 100;
          const ustKurus = dilim.ustSinir === null ? Infinity : dilim.ustSinir * 100;
          const kesisimBaslangic = Math.max(oncekiKurus, altKurus);
          const kesisimBitis = Math.min(yeniKurus, ustKurus);
          const cariDilimKurus = Math.max(0, kesisimBitis - kesisimBaslangic);
          const cariVergiKurus = Math.round(cariDilimKurus * dilim.oran);
          return {
            ...dilim,
            cariDilimTutar: fromKurus(cariDilimKurus),
            cariDilimVergi: fromKurus(cariVergiKurus),
            aktif: cariDilimKurus > 0,
          };
        });
      }

      function parseSayiGirdisi(raw) {
        if (raw === '' || raw === null || raw === undefined) return NaN;
        let str = String(raw).trim();
        if (!str) return NaN;
        str = str.replace(/tl|₺|\s+/gi, '');
        if (!str) return NaN;

        const hasComma = str.includes(',');
        const hasDot = str.includes('.');

        if (hasComma && hasDot) {
          if (str.lastIndexOf(',') > str.lastIndexOf('.')) {
            // Türk formatı: 100.000,00 veya 4.537,75
            str = str.replace(/\./g, '').replace(',', '.');
          } else {
            // İngilizce format: 100,000.00
            str = str.replace(/,/g, '');
          }
        } else if (hasComma) {
          const parts = str.split(',');
          if (parts.length > 2) {
            str = str.replace(/,/g, '');
          } else {
            str = str.replace(',', '.');
          }
        } else if (hasDot) {
          const parts = str.split('.');
          if (parts.length > 2) {
            str = str.replace(/\./g, '');
          } else {
            const [intPart, decPart] = parts;
            if (/^-?[1-9]\d{0,2}$/.test(intPart) && /^\d{3}$/.test(decPart)) {
              // Türk binlik ayracı: 100.000, 16.250, 85.000, 4.537
              str = intPart + decPart;
            }
          }
        }

        if (!/^-?\d+(\.\d+)?$/.test(str)) return NaN;
        const num = Number(str);
        return Number.isFinite(num) ? num : NaN;
      }

      function parsePozitifSayi(raw) {
        if (raw === '' || raw === null || raw === undefined || String(raw).trim() === '') {
          return { gecerli: true, deger: 0, bos: true, hata: '' };
        }
        const num = parseSayiGirdisi(raw);
        if (!Number.isFinite(num)) {
          return { gecerli: false, deger: 0, bos: false, hata: 'Lütfen geçerli bir sayı giriniz.' };
        }
        if (num < 0) {
          return { gecerli: false, deger: 0, bos: false, hata: 'Negatif tutar girilemez; lütfen 0 veya daha büyük bir tutar yazınız.' };
        }
        return { gecerli: true, deger: num, bos: false, hata: '' };
      }

      function dilimParcalariniBul(oncekiTL, aylikMatrahTL, tarifeDilimleri) {
        const oncekiK = toKurus(Math.max(0, Number(oncekiTL) || 0));
        const yeniK = oncekiK + toKurus(Math.max(0, Number(aylikMatrahTL) || 0));
        const parcalar = [];
        for (const dilim of tarifeDilimleri) {
          const altK = Math.round((Number(dilim.altSinir) || 0) * 100);
          const ustK = dilim.ustSinir === null || dilim.ustSinir === '' || !Number.isFinite(Number(dilim.ustSinir))
            ? Infinity
            : Math.round(Number(dilim.ustSinir) * 100);
          const bas = Math.max(oncekiK, altK);
          const bit = Math.min(yeniK, ustK);
          if (bit > bas) {
            parcalar.push({
              id: dilim.id,
              ad: dilim.ad,
              oran: dilim.oran,
              oranYuzde: dilim.oranYuzde,
              tutarTL: fromKurus(bit - bas),
            });
          }
        }
        return parcalar;
      }

      function IstisnaSoruKutusu({
        etiket,
        aciklama,
        formul,
        adimRehberi,
        value,
        onChange,
        dogruDeger,
        hataNedeni,
        basariMesaji,
        focusColor = 'sky',
      }) {
        const girildi = value !== '' && value !== null && value !== undefined && String(value).trim() !== '';
        const sayisal = parseSayiGirdisi(value);
        const dogruMu = girildi && Number.isFinite(sayisal) && Math.abs(sayisal - dogruDeger) < 0.05;
        const hataliMi = girildi && !dogruMu;

        return (
          <div className={`bg-slate-950 border rounded-xl p-4 sm:p-5 flex flex-col justify-between transition-colors ${
            !girildi
              ? 'border-slate-800'
              : dogruMu
                ? 'border-emerald-500/70 bg-emerald-950/20'
                : 'border-rose-500/70 bg-rose-950/20'
          }`}>
            <div>
              <div className="flex items-center justify-between gap-2">
                <span className="text-sm font-semibold text-slate-100">{etiket}</span>
                {girildi && (dogruMu ? <IconCheck /> : <IconX />)}
              </div>
              {aciklama && (
                <p className="mt-1.5 text-xs text-slate-300 leading-relaxed">
                  {aciklama}
                </p>
              )}
              <div className="mt-2 text-xs text-sky-300/90 font-mono bg-slate-900/90 border border-slate-800 rounded-md px-2.5 py-1.5">
                {formul}
              </div>
              {adimRehberi && (
                <div className="mt-2 text-xs text-slate-200 bg-indigo-950/30 border border-indigo-500/30 rounded-md px-2.5 py-2 leading-relaxed">
                  {adimRehberi}
                </div>
              )}
            </div>
            <div className="mt-3 flex flex-col gap-2">
              <div className="relative">
                <input
                  type="text"
                  inputMode="decimal"
                  placeholder="Hesapladığınız tutarı girin..."
                  value={value}
                  onChange={(e) => onChange(e.target.value)}
                  className={`w-full bg-slate-900 border rounded-lg px-3 py-2.5 font-mono tabular-nums font-bold text-right pr-10 focus:outline-none focus:ring-2 min-h-[44px] ${
                    !girildi
                      ? `border-slate-700 text-white focus:ring-${focusColor}-500`
                      : dogruMu
                        ? 'border-emerald-500 focus:ring-emerald-500 text-emerald-300'
                        : 'border-rose-500 focus:ring-rose-500 text-rose-300'
                  }`}
                />
                <span className="absolute right-3 top-3 text-slate-400 text-xs font-mono">TL</span>
              </div>
              {hataliMi && (
                <div className="text-xs text-rose-300 bg-rose-950/40 border border-rose-500/40 rounded-lg px-3 py-2 flex items-start gap-2">
                  <IconInfo />
                  <span>{Number.isFinite(sayisal) ? hataNedeni(sayisal) : 'Geçerli bir tutar giriniz (ör. 16250 veya 16.250,00).'}</span>
                </div>
              )}
              {dogruMu && (
                <div className="text-xs text-emerald-300 font-medium flex items-center gap-1.5">
                  <IconCheck />
                  <span>{basariMesaji || `Doğru: ${formatTL(dogruDeger)}`}</span>
                </div>
              )}
            </div>
          </div>
        );
      }

      const DILIM_GORSEL_RENKLERI = [
        { bar: 'bg-sky-400', text: 'text-sky-300', badge: 'bg-sky-500/20 text-sky-200 border-sky-400/50', soft: 'bg-sky-950/40 border-sky-400/50', ad: 'Mavi' },
        { bar: 'bg-emerald-400', text: 'text-emerald-300', badge: 'bg-emerald-500/20 text-emerald-200 border-emerald-400/50', soft: 'bg-emerald-950/40 border-emerald-400/50', ad: 'Yeşil' },
        { bar: 'bg-amber-400', text: 'text-amber-300', badge: 'bg-amber-500/20 text-amber-200 border-amber-400/50', soft: 'bg-amber-950/40 border-amber-400/50', ad: 'Sarı' },
        { bar: 'bg-orange-400', text: 'text-orange-300', badge: 'bg-orange-500/20 text-orange-200 border-orange-400/50', soft: 'bg-orange-950/40 border-orange-400/50', ad: 'Turuncu' },
        { bar: 'bg-rose-400', text: 'text-rose-300', badge: 'bg-rose-500/20 text-rose-200 border-rose-400/50', soft: 'bg-rose-950/40 border-rose-400/50', ad: 'Kırmızı' },
      ];

      function KumulatifDilimDiyagrami({
        baslik,
        altAciklama,
        ay,
        oncekiKumulatif = 0,
        aylikMatrah = 0,
        tarifeDilimleri = [],
        matrahBiliniyorMu = false,
        vergiBiliniyorMu = false,
      }) {
        const yeniKumulatif = oncekiKumulatif + aylikMatrah;
        const aylikParcalar = useMemo(
          () => dilimParcalariniBul(oncekiKumulatif, aylikMatrah, tarifeDilimleri),
          [oncekiKumulatif, aylikMatrah, tarifeDilimleri]
        );

        const renkGetir = (dilimId) => {
          const idx = Math.max(0, tarifeDilimleri.findIndex((d) => d.id === dilimId));
          return DILIM_GORSEL_RENKLERI[idx] || DILIM_GORSEL_RENKLERI[DILIM_GORSEL_RENKLERI.length - 1];
        };

        const aktifHedefMatrah = matrahBiliniyorMu ? yeniKumulatif : oncekiKumulatif;
        const esikler = tarifeDilimleri
          .map((d) => Number(d.ustSinir))
          .filter((u) => Number.isFinite(u) && u > 0);
        const ilkEsik = esikler[0] || 190000;
        const asilanSonrakiEsik = esikler.find((u) => u >= Math.max(aktifHedefMatrah * 1.1, ilkEsik));
        const olcekTavan = Math.max(
          asilanSonrakiEsik || Math.ceil(aktifHedefMatrah * 1.15),
          ilkEsik,
          1
        );

        const oncekiOranYuzde = Math.min(100, (oncekiKumulatif / olcekTavan) * 100);
        const gorunenEsikler = esikler.filter((e) => e <= olcekTavan);
        const gecisVarMi = matrahBiliniyorMu && aylikParcalar.length > 1;
        const aylikToplam = Math.max(1, aylikParcalar.reduce((acc, p) => acc + p.tutarTL, 0));

        return (
          <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 flex flex-col gap-5">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800/80 pb-3.5">
              <div>
                <h3 className="text-base font-bold text-white">{baslik}</h3>
                <p className="text-xs sm:text-sm text-slate-300 mt-0.5">{altAciklama}</p>
              </div>
              {matrahBiliniyorMu && (
                <div className={`px-3.5 py-1.5 rounded-lg border text-xs sm:text-sm font-bold shrink-0 ${
                  gecisVarMi
                    ? 'bg-amber-950/50 border-amber-400/60 text-amber-200'
                    : `${renkGetir(aylikParcalar[0]?.id).badge}`
                }`}>
                  {gecisVarMi
                    ? `Dilim Geçişi: ${aylikParcalar.map((p) => p.oranYuzde).join(' → ')}`
                    : `Aktif Skala: ${aylikParcalar[0]?.oranYuzde || '%15'}`}
                </div>
              )}
            </div>

            {/* 1. Kümülatif Birikim Ölçeği */}
            <div className="flex flex-col gap-3">
              <div className="flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm">
                <span className="font-semibold text-indigo-300">
                  Kümülatif Konum: <span className="font-mono text-slate-200">{formatTL(oncekiKumulatif)}</span> →{' '}
                  <span className="font-mono font-bold text-white">
                    {matrahBiliniyorMu ? formatTL(yeniKumulatif) : '? TL'}
                  </span>
                </span>
                <span className="font-mono text-xs text-slate-300">Ölçek: 0 – {formatTL(olcekTavan)}</span>
              </div>

              <div className="relative h-10 bg-slate-900 border border-slate-700 rounded-lg overflow-hidden flex">
                {oncekiKumulatif > 0 && (
                  <div
                    style={{ width: `${oncekiOranYuzde}%` }}
                    className="h-full bg-slate-600 border-r border-slate-900 flex items-center justify-center px-2 text-xs font-mono font-semibold text-white truncate"
                    title={`Önceki Kümülatif: ${formatTL(oncekiKumulatif)}`}
                  >
                    {oncekiOranYuzde >= 16 ? `Önceki: ${formatSayi(oncekiKumulatif)}` : ''}
                  </div>
                )}
                {matrahBiliniyorMu ? (
                  aylikParcalar.map((p) => {
                    const genislik = Math.min(100 - oncekiOranYuzde, (p.tutarTL / olcekTavan) * 100);
                    const renk = renkGetir(p.id);
                    return (
                      <div
                        key={p.id}
                        style={{ width: `${genislik}%` }}
                        className={`h-full ${renk.bar} border-r border-slate-950/40 last:border-r-0 flex items-center justify-center px-1.5 text-xs font-mono font-extrabold text-slate-950 truncate`}
                        title={`${ay} ayı ${p.oranYuzde} dilim parçası: ${formatTL(p.tutarTL)}`}
                      >
                        {genislik >= 10 ? `${p.oranYuzde}` : ''}
                      </div>
                    );
                  })
                ) : (
                  <div className="flex-1 h-full flex items-center px-3 text-xs text-slate-400 font-mono">
                    {oncekiKumulatif > 0
                      ? `+ ${ay} ayı matrahı eklendiğinde hangi dilime ulaştığı burada görünecek`
                      : `${ay} ayı matrahı eklendiğinde kümülatif çubuk burada dolacak`}
                  </div>
                )}

                {gorunenEsikler.map((esik, idx) => {
                  const leftYuzde = (esik / olcekTavan) * 100;
                  if (leftYuzde <= 2 || leftYuzde >= 99) return null;
                  return (
                    <div
                      key={esik}
                      style={{ left: `${leftYuzde}%` }}
                      className="absolute top-0 bottom-0 w-0.5 bg-white pointer-events-none"
                      title={`${idx + 1}. Dilim Sınırı: ${formatTL(esik)}`}
                    />
                  );
                })}
              </div>

              <div className="flex flex-wrap items-center justify-between gap-2 text-xs font-mono text-slate-300">
                <span>0 TL</span>
                <div className="flex flex-wrap items-center gap-4">
                  {gorunenEsikler.map((esik, idx) => (
                    <span key={esik}>
                      <strong className="text-white">|</strong> {idx + 1}. Dilim Sınırı: <strong className="text-white">{formatTL(esik)}</strong>
                    </span>
                  ))}
                </div>
              </div>
            </div>

            {/* 2. Bu Ayın Vergi Dilimi Parçaları Barı */}
            <div className="flex flex-col gap-3 pt-3 border-t border-slate-800/80">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                <span className="text-xs sm:text-sm font-semibold text-sky-300">
                  {ay} Ayı Matrahının Vergilendirilen Dilimleri
                </span>
                {matrahBiliniyorMu && (
                  <span className="text-xs sm:text-sm font-mono text-slate-200">
                    Bu Ayki Matrah: <strong className="text-white">{formatTL(aylikMatrah)}</strong>
                  </span>
                )}
              </div>

              {!matrahBiliniyorMu ? (
                <div className="bg-slate-900/70 border border-dashed border-slate-700 rounded-lg px-4 py-3 text-xs sm:text-sm text-slate-300">
                  Önce yeni kümülatif matrahı bulun; ardından bu ayki matrahın hangi dilimlerden vergilendirildiği renkli olarak açılacaktır.
                </div>
              ) : (
                <>
                  <div className="w-full h-12 bg-slate-900 border border-slate-700 rounded-lg overflow-hidden flex">
                    {aylikParcalar.map((p) => {
                      const renk = renkGetir(p.id);
                      const yuzde = (p.tutarTL / aylikToplam) * 100;
                      return (
                        <div
                          key={p.id}
                          style={{ width: `${yuzde}%` }}
                          className={`h-full ${renk.bar} text-slate-950 font-extrabold text-xs sm:text-sm flex items-center justify-center gap-1.5 px-2.5 border-r border-slate-950/30 last:border-r-0 overflow-hidden transition-all`}
                          title={`${p.ad}: ${formatTL(p.tutarTL)} (${p.oranYuzde})`}
                        >
                          {yuzde >= 14 ? (
                            <span className="truncate font-mono tabular-nums">
                              {p.oranYuzde} · {formatSayi(p.tutarTL)} TL
                            </span>
                          ) : (
                            <span className="font-mono tabular-nums">{p.oranYuzde}</span>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  <div className={`grid grid-cols-1 ${aylikParcalar.length >= 3 ? 'sm:grid-cols-3' : aylikParcalar.length === 2 ? 'sm:grid-cols-2' : ''} gap-3`}>
                    {aylikParcalar.map((p, idx) => {
                      const renk = renkGetir(p.id);
                      const parcaVergi = fromKurus(Math.round(toKurus(p.tutarTL) * p.oran));
                      const payYuzde = ((p.tutarTL / aylikToplam) * 100).toFixed(1);
                      const rolEtiketi =
                        aylikParcalar.length === 1
                          ? `Tamamı ${p.oranYuzde} Skalasından Kesilir`
                          : idx === 0
                            ? `Önceki Dilimde Kalan (${p.oranYuzde})`
                            : `Üst Dilime Taşan (${p.oranYuzde})`;

                      return (
                        <div key={p.id} className={`rounded-lg border p-3.5 flex flex-col gap-1.5 ${renk.soft}`}>
                          <div className="flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2 min-w-0">
                              <span className={`w-3.5 h-3.5 rounded shrink-0 ${renk.bar}`} aria-hidden="true" />
                              <span className="text-xs sm:text-sm font-bold text-white truncate">{rolEtiketi}</span>
                            </div>
                            <span className="text-xs font-mono font-semibold text-slate-200 shrink-0">%{payYuzde}</span>
                          </div>
                          <div className="font-mono tabular-nums text-base font-bold text-white">
                            {formatTL(p.tutarTL)}
                          </div>
                          <div className="font-mono tabular-nums text-xs sm:text-sm text-slate-200">
                            {vergiBiliniyorMu
                              ? `${formatSayi(p.tutarTL)} × ${p.oranYuzde} = ${formatTL(parcaVergi)}`
                              : `${formatSayi(p.tutarTL)} × ${p.oranYuzde} = ? TL`}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}
            </div>
          </div>
        );
      }

      function AsgariUcretIstisnasiAdimi({ activeStep, onGoToStep, onVergiDilimiCompleteChange, onCompleteChange, onBack, onReset }) {
        const [altAsama, setAltAsama] = useState(2);
        const [paramPanelAcik, setParamPanelAcik] = useState(false);

        const [params, setParams] = useState(() => ({
          yil: VARSAYILAN_BORDRO_PARAMETRELERI.yil,
          asgariUcretBrut: VARSAYILAN_BORDRO_PARAMETRELERI.asgariUcretBrut,
          sgkIsciOran: VARSAYILAN_BORDRO_PARAMETRELERI.sgkIsciOran,
          issizlikIsciOran: VARSAYILAN_BORDRO_PARAMETRELERI.issizlikIsciOran,
          damgaVergisiOran: VARSAYILAN_BORDRO_PARAMETRELERI.damgaVergisiOran,
          tarifeDilimleri: VARSAYILAN_BORDRO_PARAMETRELERI.tarifeDilimleri.map((d) => ({ ...d })),
        }));

        const [senaryoId, setSenaryoId] = useState('ocak');
        const [matrahCevap, setMatrahCevap] = useState('');
        const [aktifAyIdx, setAktifAyIdx] = useState(0);
        const [ayCevaplari, setAyCevaplari] = useState([
          { matrahOrKum: '', vergi: '' },
          { matrahOrKum: '', vergi: '' },
          { matrahOrKum: '', vergi: '' },
          { matrahOrKum: '', vergi: '' },
        ]);
        const [personel, setPersonel] = useState({
          ad: 'Ayşe Yılmaz',
          unvan: 'Kıdemli Uzman',
          ay: 'Nisan',
          aylar: ['Ocak', 'Şubat', 'Mart', 'Nisan'],
          roller: [
            '%15 Dilimi (1. Ay)',
            '%15 Dilimi (2. Ay)',
            '%15 → %20 Geçiş Ayı',
            '%20 Skalasında Devam',
          ],
          brut: 100000,
          brutHam: '100000',
          personelOncekiKumulatif: 0,
          personelOncekiHam: '0',
          asgariOncekiKumulatif: 84226.5,
          asgariOncekiHam: '84226,50',
        });

        const [cevaplar, setCevaplar] = useState({
          asgariGvMatrah: '',
          asgariHesaplananGv: '',
          odenecekGv: '',
          personelDamga: '',
          asgariDamgaIstisna: '',
          odenecekDamga: '',
          ikiVergiToplami: '',
          istisnaliNet: '',
        });

        const [sinav, setSinav] = useState({
          soru1OdenecekGv: '',
          soru2OdenecekDamga: '',
          soru3Secim: null,
          soru4Secim: null,
        });

        const temizleCevaplar = () => {
          setMatrahCevap('');
          setAyCevaplari([
            { matrahOrKum: '', vergi: '' },
            { matrahOrKum: '', vergi: '' },
            { matrahOrKum: '', vergi: '' },
            { matrahOrKum: '', vergi: '' },
          ]);
          setAktifAyIdx(0);
          setCevaplar({
            asgariGvMatrah: '',
            asgariHesaplananGv: '',
            odenecekGv: '',
            personelDamga: '',
            asgariDamgaIstisna: '',
            odenecekDamga: '',
            ikiVergiToplami: '',
            istisnaliNet: '',
          });
          setAltAsama(2);
          onVergiDilimiCompleteChange(false);
          onCompleteChange(false);
        };

        const temizleAsgariGvCevaplar = () => {
          setCevaplar((c) => ({
            ...c,
            asgariGvMatrah: '',
            asgariHesaplananGv: '',
            odenecekGv: '',
            ikiVergiToplami: '',
            istisnaliNet: '',
          }));
          onCompleteChange(false);
        };

        const secSenaryo = (id) => {
          setSenaryoId(id);
          if (id === 'ocak') {
            setPersonel({
              ad: 'Ayşe Yılmaz',
              unvan: 'Kıdemli Uzman',
              ay: 'Nisan',
              aylar: ['Ocak', 'Şubat', 'Mart', 'Nisan'],
              roller: [
                '%15 Dilimi (1. Ay)',
                '%15 Dilimi (2. Ay)',
                '%15 → %20 Geçiş Ayı',
                '%20 Skalasında Devam',
              ],
              brut: 100000,
              brutHam: '100000',
              personelOncekiKumulatif: 0,
              personelOncekiHam: '0',
              asgariOncekiKumulatif: 84226.5,
              asgariOncekiHam: '84226,50',
            });
          } else if (id === 'temmuz') {
            setPersonel({
              ad: 'Mehmet Kaya',
              unvan: 'Yazılım Mühendisi',
              ay: 'Eylül',
              aylar: ['Haziran', 'Temmuz', 'Ağustos', 'Eylül'],
              roller: [
                '%20 Dilimi (1. Ay)',
                '%20 Dilimi (2. Ay)',
                '%20 → %27 Geçiş Ayı',
                '%27 Skalasında Devam',
              ],
              brut: 100000,
              brutHam: '100000',
              personelOncekiKumulatif: 220000,
              personelOncekiHam: '220000',
              asgariOncekiKumulatif: 224604,
              asgariOncekiHam: '224604',
            });
          } else {
            setPersonel({
              ad: 'Zeynep Demir',
              unvan: 'Yarı Zamanlı Uzman',
              ay: 'Nisan',
              aylar: ['Ocak', 'Şubat', 'Mart', 'Nisan'],
              roller: [
                '1. Ay (%15)',
                '2. Ay (%15)',
                '3. Ay (%15)',
                '4. Ay (%15 · İstisna Tavanı)',
              ],
              brut: 25000,
              brutHam: '25000',
              personelOncekiKumulatif: 0,
              personelOncekiHam: '0',
              asgariOncekiKumulatif: 84226.5,
              asgariOncekiHam: '84226,50',
            });
          }
          temizleCevaplar();
        };

        // Kuruş bazlı tüm merkezi hesaplamalar (4 ardışık ay + 4. aydan istisnaya aktarım)
        const hesap = useMemo(() => {
          const pBrutK = toKurus(Math.max(0, Number(personel.brut) || 0));
          const aBrutK = toKurus(Math.max(0, Number(params.asgariUcretBrut) || 0));

          const pSgkK = Math.round(pBrutK * params.sgkIsciOran);
          const pIssizlikK = Math.round(pBrutK * params.issizlikIsciOran);
          const pGvMatrahK = Math.max(0, pBrutK - pSgkK - pIssizlikK);

          const pBaslangicOncekiK = toKurus(Math.max(0, Number(personel.personelOncekiKumulatif) || 0));

          const aSgkK = Math.round(aBrutK * params.sgkIsciOran);
          const aIssizlikK = Math.round(aBrutK * params.issizlikIsciOran);
          const aGvMatrahK = Math.max(0, aBrutK - aSgkK - aIssizlikK);
          const aOncekiK = toKurus(Math.max(0, Number(personel.asgariOncekiKumulatif) || 0));

          // Damga vergisi kümülatif değildir
          const pHesaplananDamgaK = Math.round(pBrutK * params.damgaVergisiOran);
          const aHesaplananDamgaK = Math.round(aBrutK * params.damgaVergisiOran);
          const damgaIstisnaK = Math.min(pHesaplananDamgaK, aHesaplananDamgaK);
          const odenecekDamgaK = Math.max(0, pHesaplananDamgaK - damgaIstisnaK);

          const aylikSeri = [0, 1, 2, 3].map((i) => {
            const oncekiK = pBaslangicOncekiK + i * pGvMatrahK;
            const yeniK = oncekiK + pGvMatrahK;
            const oncekiVergiK = tarifeVergisiHesaplaKurus(oncekiK, params.tarifeDilimleri);
            const yeniVergiK = tarifeVergisiHesaplaKurus(yeniK, params.tarifeDilimleri);
            const ayVergiK = Math.max(0, yeniVergiK - oncekiVergiK);
            const oncekiTL = fromKurus(oncekiK);
            const matrahTL = fromKurus(pGvMatrahK);
            const parcalar = dilimParcalariniBul(oncekiTL, matrahTL, params.tarifeDilimleri);

            const ayAsgariOncekiK = Math.max(0, aOncekiK - (3 - i) * aGvMatrahK);
            const ayAsgariYeniK = ayAsgariOncekiK + aGvMatrahK;
            const ayAsgariGvK = Math.max(
              0,
              tarifeVergisiHesaplaKurus(ayAsgariYeniK, params.tarifeDilimleri) -
                tarifeVergisiHesaplaKurus(ayAsgariOncekiK, params.tarifeDilimleri)
            );
            const ayGvIstisnaK = Math.min(ayVergiK, ayAsgariGvK);
            const ayOdenecekGvK = Math.max(0, ayVergiK - ayGvIstisnaK);

            return {
              idx: i,
              ay: (personel.aylar && personel.aylar[i]) || AYLAR[i],
              rol: (personel.roller && personel.roller[i]) || `${i + 1}. Ay`,
              oncekiKumulatif: oncekiTL,
              yeniKumulatif: fromKurus(yeniK),
              oncekiVergi: fromKurus(oncekiVergiK),
              yeniVergi: fromKurus(yeniVergiK),
              ayVergi: fromKurus(ayVergiK),
              ayVergiK,
              parcalar,
              asgariGvTavan: fromKurus(ayAsgariGvK),
              gvIstisna: fromKurus(ayGvIstisnaK),
              odenecekGv: fromKurus(ayOdenecekGvK),
              damgaIstisna: fromKurus(damgaIstisnaK),
              odenecekDamga: fromKurus(odenecekDamgaK),
            };
          });

          const sonAy = aylikSeri[3];
          const pOncekiK = toKurus(sonAy.oncekiKumulatif);
          const pYeniKumK = toKurus(sonAy.yeniKumulatif);
          const pOncekiVergiK = toKurus(sonAy.oncekiVergi);
          const pYeniVergiK = toKurus(sonAy.yeniVergi);
          const pHesaplananGvK = sonAy.ayVergiK;

          const aYeniKumK = aOncekiK + aGvMatrahK;
          const aOncekiVergiK = tarifeVergisiHesaplaKurus(aOncekiK, params.tarifeDilimleri);
          const aYeniVergiK = tarifeVergisiHesaplaKurus(aYeniKumK, params.tarifeDilimleri);
          const aHesaplananGvK = Math.max(0, aYeniVergiK - aOncekiVergiK);

          const gvIstisnaK = Math.min(pHesaplananGvK, aHesaplananGvK);
          const odenecekGvK = Math.max(0, pHesaplananGvK - gvIstisnaK);

          const ikiVergiToplamiK = odenecekGvK + odenecekDamgaK;
          const istisnaliNetK = Math.max(0, pBrutK - pSgkK - pIssizlikK - ikiVergiToplamiK);
          const istisnasizNetK = Math.max(0, pBrutK - pSgkK - pIssizlikK - pHesaplananGvK - pHesaplananDamgaK);
          const netArtisK = Math.max(0, istisnaliNetK - istisnasizNetK);

          return {
            pBrut: fromKurus(pBrutK),
            aBrut: fromKurus(aBrutK),
            pSgk: fromKurus(pSgkK),
            pIssizlik: fromKurus(pIssizlikK),
            pGvMatrah: fromKurus(pGvMatrahK),
            pBaslangicOncekiKumulatif: fromKurus(pBaslangicOncekiK),
            aylikSeri,
            pOncekiKumulatif: fromKurus(pOncekiK),
            pYeniKumulatif: fromKurus(pYeniKumK),
            pOncekiVergi: fromKurus(pOncekiVergiK),
            pYeniVergi: fromKurus(pYeniVergiK),
            pHesaplananGv: fromKurus(pHesaplananGvK),
            aSgk: fromKurus(aSgkK),
            aIssizlik: fromKurus(aIssizlikK),
            aGvMatrah: fromKurus(aGvMatrahK),
            aOncekiKumulatif: fromKurus(aOncekiK),
            aYeniKumulatif: fromKurus(aYeniKumK),
            aOncekiVergi: fromKurus(aOncekiVergiK),
            aYeniVergi: fromKurus(aYeniVergiK),
            aHesaplananGv: fromKurus(aHesaplananGvK),
            gvIstisna: fromKurus(gvIstisnaK),
            odenecekGv: fromKurus(odenecekGvK),
            pHesaplananDamga: fromKurus(pHesaplananDamgaK),
            aHesaplananDamga: fromKurus(aHesaplananDamgaK),
            damgaIstisna: fromKurus(damgaIstisnaK),
            odenecekDamga: fromKurus(odenecekDamgaK),
            ikiVergiToplami: fromKurus(ikiVergiToplamiK),
            istisnaliNet: fromKurus(istisnaliNetK),
            istisnasizNet: fromKurus(istisnasizNetK),
            netArtis: fromKurus(netArtisK),
          };
        }, [personel, params]);

        // Uygulama Sınavı senaryosu (dinamik olarak aktif parametrelerle hesaplanır)
        const sinavHesap = useMemo(() => {
          const pBrutK = toKurus(50000);
          const pSgkK = Math.round(pBrutK * params.sgkIsciOran);
          const pIssizlikK = Math.round(pBrutK * params.issizlikIsciOran);
          const pMatrahK = Math.max(0, pBrutK - pSgkK - pIssizlikK);
          const pOncekiK = toKurus(180000);
          const pGvK = Math.max(
            0,
            tarifeVergisiHesaplaKurus(pOncekiK + pMatrahK, params.tarifeDilimleri) -
              tarifeVergisiHesaplaKurus(pOncekiK, params.tarifeDilimleri)
          );

          const aBrutK = toKurus(params.asgariUcretBrut);
          const aMatrahK = Math.max(0, aBrutK - Math.round(aBrutK * params.sgkIsciOran) - Math.round(aBrutK * params.issizlikIsciOran));
          const aOncekiK = toKurus(112302);
          const aGvK = Math.max(
            0,
            tarifeVergisiHesaplaKurus(aOncekiK + aMatrahK, params.tarifeDilimleri) -
              tarifeVergisiHesaplaKurus(aOncekiK, params.tarifeDilimleri)
          );

          const odenecekGvK = Math.max(0, pGvK - Math.min(pGvK, aGvK));
          const pDamgaK = Math.round(pBrutK * params.damgaVergisiOran);
          const aDamgaK = Math.round(aBrutK * params.damgaVergisiOran);
          const odenecekDamgaK = Math.max(0, pDamgaK - Math.min(pDamgaK, aDamgaK));

          return {
            pBrut: fromKurus(pBrutK),
            pMatrah: fromKurus(pMatrahK),
            pOnceki: 180000,
            pHesaplananGv: fromKurus(pGvK),
            aMatrah: fromKurus(aMatrahK),
            aOnceki: 112302,
            aHesaplananGv: fromKurus(aGvK),
            odenecekGv: fromKurus(odenecekGvK),
            pDamga: fromKurus(pDamgaK),
            aDamga: fromKurus(aDamgaK),
            odenecekDamga: fromKurus(odenecekDamgaK),
          };
        }, [params]);

        const isNear = (raw, target) => {
          if (raw === '' || raw === null || raw === undefined) return false;
          const n = parseSayiGirdisi(raw);
          return Number.isFinite(n) && Math.abs(n - target) < 0.05;
        };

        const pMatrahOk = isNear(matrahCevap, hesap.pGvMatrah);

        const ayAOk = [
          pMatrahOk,
          pMatrahOk && isNear(ayCevaplari[1].matrahOrKum, hesap.aylikSeri[1].yeniKumulatif),
          pMatrahOk && isNear(ayCevaplari[2].matrahOrKum, hesap.aylikSeri[2].yeniKumulatif),
          pMatrahOk && isNear(ayCevaplari[3].matrahOrKum, hesap.aylikSeri[3].yeniKumulatif),
        ];
        const ayBOk = [
          pMatrahOk && isNear(ayCevaplari[0].vergi, hesap.aylikSeri[0].ayVergi),
          pMatrahOk && isNear(ayCevaplari[1].vergi, hesap.aylikSeri[1].ayVergi),
          pMatrahOk && isNear(ayCevaplari[2].vergi, hesap.aylikSeri[2].ayVergi),
          pMatrahOk && isNear(ayCevaplari[3].vergi, hesap.aylikSeri[3].ayVergi),
        ];
        const ayTamam = [
          ayAOk[0] && ayBOk[0],
          ayAOk[0] && ayBOk[0] && ayAOk[1] && ayBOk[1],
          ayAOk[0] && ayBOk[0] && ayAOk[1] && ayBOk[1] && ayAOk[2] && ayBOk[2],
          ayAOk[0] && ayBOk[0] && ayAOk[1] && ayBOk[1] && ayAOk[2] && ayBOk[2] && ayAOk[3] && ayBOk[3],
        ];
        const asama1Tamam = ayTamam[3];

        useEffect(() => {
          onVergiDilimiCompleteChange(asama1Tamam);
        }, [asama1Tamam]);

        const c3Ok = isNear(cevaplar.asgariGvMatrah, hesap.aGvMatrah);
        const c4Ok = isNear(cevaplar.asgariHesaplananGv, hesap.aHesaplananGv);
        const c5Ok = isNear(cevaplar.odenecekGv, hesap.odenecekGv);
        const asama2Tamam = c3Ok && c4Ok && c5Ok;

        const d1Ok = isNear(cevaplar.personelDamga, hesap.pHesaplananDamga);
        const d2Ok = isNear(cevaplar.asgariDamgaIstisna, hesap.damgaIstisna);
        const d3Ok = isNear(cevaplar.odenecekDamga, hesap.odenecekDamga);
        const asama3Tamam = asama2Tamam && d1Ok && d2Ok && d3Ok;

        const b1Ok = isNear(cevaplar.ikiVergiToplami, hesap.ikiVergiToplami);
        const b2Ok = isNear(cevaplar.istisnaliNet, hesap.istisnaliNet);
        const asama4Tamam = asama3Tamam && b1Ok && b2Ok;

        const s1Ok = isNear(sinav.soru1OdenecekGv, sinavHesap.odenecekGv);
        const s2Ok = isNear(sinav.soru2OdenecekDamga, sinavHesap.odenecekDamga);
        const s3Ok = sinav.soru3Secim === 1;
        const s4Ok = sinav.soru4Secim === 2;
        const sinavTamam = s1Ok && s2Ok && s3Ok && s4Ok;

        const asamaAcikMi = (hedef) => {
          if (hedef === 2) return true;
          if (hedef === 3) return asama2Tamam;
          if (hedef === 4) return asama3Tamam;
          if (hedef === 5) return asama4Tamam;
          return false;
        };

        const handleSinavGuncelle = (yeni) => {
          setSinav(yeni);
          const hepsiOk =
            isNear(yeni.soru1OdenecekGv, sinavHesap.odenecekGv) &&
            isNear(yeni.soru2OdenecekDamga, sinavHesap.odenecekDamga) &&
            yeni.soru3Secim === 1 &&
            yeni.soru4Secim === 2;
          onCompleteChange(asama4Tamam && hepsiOk);
        };

        const altAsamalar = [
          { no: 2, baslik: '7.1 Asgari Ücret GV İstisnası', tamam: asama2Tamam },
          { no: 3, baslik: '7.2 Damga Vergisi İstisnası', tamam: asama3Tamam },
          { no: 4, baslik: '7.3 Birleştirme & Net Etki', tamam: asama4Tamam },
          { no: 5, baslik: '7.4 Uygulama Sınavı', tamam: sinavTamam },
        ];

        const parametreSifirla2026 = () => {
          setParams({
            yil: VARSAYILAN_BORDRO_PARAMETRELERI.yil,
            asgariUcretBrut: VARSAYILAN_BORDRO_PARAMETRELERI.asgariUcretBrut,
            sgkIsciOran: VARSAYILAN_BORDRO_PARAMETRELERI.sgkIsciOran,
            issizlikIsciOran: VARSAYILAN_BORDRO_PARAMETRELERI.issizlikIsciOran,
            damgaVergisiOran: VARSAYILAN_BORDRO_PARAMETRELERI.damgaVergisiOran,
            tarifeDilimleri: VARSAYILAN_BORDRO_PARAMETRELERI.tarifeDilimleri.map((d) => ({ ...d })),
          });
          temizleCevaplar();
        };

          setParams((prev) => {

              if (field === 'oranYuzdeSayi') {
                const oranSayi = Math.max(0, Number(val) || 0) / 100;
                return { ...d, oran: oranSayi, oranYuzde: `%${val || 0}` };
              }
              return { ...d, [field]: val === '' ? null : Math.max(0, Number(val) || 0) };
            });
            return { ...prev, tarifeDilimleri: yeni };
          });
          temizleCevaplar();
        };

        return (

                    <label className="block text-[11px] text-slate-400 mb-1">Yıl</label>
                    <input
                      type="number"
                      value={params.yil}
                      onChange={(e) => {
                        setParams((p) => ({ ...p, yil: Number(e.target.value) || 2026 }));
                        temizleCevaplar();
                      }}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-mono text-white min-h-[44px]"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1">Asgari Ücret Brüt (TL)</label>
                    <input

                      min="0"

                      onChange={(e) => {
                        setParams((p) => ({ ...p, sgkIsciOran: Math.max(0, Number(e.target.value) || 0) / 100 }));
                        temizleCevaplar();

                        <input

                          inputMode="decimal"

                            setPersonel((p) => ({

                            temizleCevaplar();

                        />
                        <div className="text-xs text-slate-400 font-mono mt-1.5">
                          Baz: {formatTL(hesap.pBrut)}

                      </div>

                      <div className="bg-slate-900 border border-slate-700 rounded-lg p-3.5">
                        <div className="flex items-center justify-between gap-2 mb-1.5">

                              ? `Başlangıç Önceki Kümülatif Matrah (TL) · ${aktifAy.ay} Öncesi`

                          {aktifAyIdx > 0 && (
                            <button

                              Başlangıcı Düzenle

                        {aktifAyIdx === 0 ? (
                          <>
                            <input

                              {formatTL(aktifAy.oncekiKumulatif)}

                              {hesap.aylikSeri[aktifAyIdx - 1].ay} sonu kümülatif matrahı otomatik devredildi
                            </div>
                          </>
                        )}
                      </div>
                    </div>

                    {/* Alt kısım: Personelin Aylık Gelir Vergisi Matrahını Hesaplama */}
                    <IstisnaSoruKutusu
                      etiket="Personelin Aylık Gelir Vergisi Matrahı"
                      aciklama={`Önce brüt ücretten %${Math.round(params.sgkIsciOran * 100)} SGK işçi primi ve %${Math.round(params.issizlikIsciOran * 100)} işsizlik işçi payını düşerek her ay vergiye tabi olacak GV matrahını hesaplayın.`}
                      formul={`Formül: Brüt (${formatTL(hesap.pBrut)}) − %${Math.round(params.sgkIsciOran * 100)} SGK (${formatTL(hesap.pSgk)}) − %${Math.round(params.issizlikIsciOran * 100)} İşsizlik (${formatTL(hesap.pIssizlik)})`}
                      value={matrahCevap}
                      onChange={setMatrahCevap}
                      dogruDeger={hesap.pGvMatrah}

                  </div>

                  {/* 2. BÖLÜM: Vergi Dilimleri ve Renk Kodları (Büyük Font & Yüksek Kontrast) */}

                    aciklama="Önce 50.000 TL brüt ücretin %85'i ile aylık GV matrahını bulun. Önceki 180.000 TL kümülatife ekleyince 190.000 TL sınırına kadar olan kısmı %15, sınırı aşan kısmı %20 ile hesaplayıp asgari ücretin %15 dilimindeki gelir vergisini düşün."
                    formul="Formül: Personel Kümülatif GV - Asgari Ücret Kümülatif GV İstisnası"
                    value={sinav.soru1OdenecekGv}
                    onChange={(v) => handleSinavGuncelle({ ...sinav, soru1OdenecekGv: v })}
                    dogruDeger={sinavHesap.odenecekGv}
                    hataNedeni={() =>
                      'Dikkat: Personelin önceki kümülatifi 180.000 TL olduğu için bu ayki 42.500 TL matrahın 10.000 TL’si %15, 32.500 TL’si %20 diliminden vergilenir; asgari ücret ise %15 dilimindedir.'
                    }
                  />

                  <IstisnaSoruKutusu
                    etiket="Sınav 2: Ödenecek Damga Vergisi Kaç TL'dir?"
                    formul="Formül: (50.000 TL × 0,00759) - (Asgari Brüt × 0,00759)"
                    value={sinav.soru2OdenecekDamga}
                    onChange={(v) => handleSinavGuncelle({ ...sinav, soru2OdenecekDamga: v })}
                    dogruDeger={sinavHesap.odenecekDamga}
                    hataNedeni={() =>
                      'Damga vergisi kümülatif matrahlarla değil, doğrudan aylık brüt tutarlar × 0,00759 farkıyla hesaplanır.'
                    }
                  />
                </div>

                {/* Kavramsal Sınav Soruları */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 flex flex-col gap-3">
                    <div className="text-sm font-semibold text-white">
                      Sınav 3: Personel ve asgari ücret kümülatif matrahları neden ayrı takip edilir?
                    </div>
                    {[
                      'İkisi her ay aynı dilimde olduğu için tek matrah yeterlidir.',
                      'Personel yüksek maaşla %20 veya %27 dilimine geçerken asgari ücret farklı bir ayda üst dilime geçebilir; istisna tutarı asgari ücretin kendi dilimine göre belirlenir.',
                      'SGK primlerini eşitlemek için ayrı takip edilir.',
                    ].map((sec, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => handleSinavGuncelle({ ...sinav, soru3Secim: idx })}
                        className={`p-3 rounded-lg border text-left text-xs transition-colors cursor-pointer min-h-[44px] ${
                          sinav.soru3Secim === idx
                            ? idx === 1
                              ? 'bg-emerald-950/50 border-emerald-500 text-emerald-200'
                              : 'bg-rose-950/50 border-rose-500 text-rose-200'
                            : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        {sec}
                      </button>
                    ))}
                    {sinav.soru3Secim !== null && !s3Ok && (
                      <div className="text-xs text-rose-300">
                        Hatalı seçim. Personelin kendi matrahı %20 dilimine erken girerken asgari ücret matrahı daha yavaş ilerler; bu yüzden iki kümülatif seri bağımsız tutulur.
                      </div>
                    )}
                    {s3Ok && (
                      <div className="text-xs text-emerald-300 flex items-center gap-1.5">
                        <IconCheck /> Doğru kavram.
                      </div>
                    )}
                  </div>

                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 flex flex-col gap-3">
                    <div className="text-sm font-semibold text-white">
                      Sınav 4: Brüt ücret asgari ücretin altındaysa istisna ve damga vergisi nasıl işler?
                    </div>
                    {[
                      'Asgari ücret istisnasının fazlası personele nakit iade olarak ödenir.',
                      'Damga vergisi de kümülatif matrah üzerinden hesaplanır.',
                      'İstisna personelin hesaplanan vergisini aşamaz (ödenecek vergi 0 TL olur) ve damga vergisi her ay brüt üzerinden tekil hesaplanır.',
                    ].map((sec, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => handleSinavGuncelle({ ...sinav, soru4Secim: idx })}
                        className={`p-3 rounded-lg border text-left text-xs transition-colors cursor-pointer min-h-[44px] ${
                          sinav.soru4Secim === idx
                            ? idx === 2
                              ? 'bg-emerald-950/50 border-emerald-500 text-emerald-200'
                              : 'bg-rose-950/50 border-rose-500 text-rose-200'
                            : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        {sec}
                      </button>
                    ))}
                    {sinav.soru4Secim !== null && !s4Ok && (
                      <div className="text-xs text-rose-300">
                        Hatalı seçim. Vergi istisnası hesaplanan vergiden fazla olamaz ve nakit iade doğurmaz; ayrıca damga vergisi kümülatif değildir.
                      </div>
                    )}
                    {s4Ok && (
                      <div className="text-xs text-emerald-300 flex items-center gap-1.5">
                        <IconCheck /> Doğru kavram.
                      </div>
                    )}
                  </div>
                </div>

                {sinavTamam && (
                  <div className="bg-emerald-950/40 border border-emerald-500 rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <div className="text-xs text-emerald-300 font-semibold">Tebrikler · Uygulama Sınavı Tamamlandı</div>
                      <h4 className="text-base font-bold text-white mt-0.5">Asgari Ücret Vergi İstisnası Uzmanlık Onayı</h4>
                      <p className="text-xs text-slate-300 mt-1">
                        Gelir vergisi ve damga vergisi istisnalarının kümülatif ve aylık hesaplama mantığını başarıyla doğruladınız.
                      </p>
                    </div>
                    <div className="bg-emerald-900/70 border border-emerald-400/50 px-4 py-2.5 rounded-lg font-mono text-sm font-bold text-white shrink-0">
                      4 / 4 Tam Başarı
                    </div>
                  </div>
                )}

                <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                  <button
                    type="button"
                    onClick={() => setAltAsama(4)}
                    className="flex items-center gap-2 px-5 py-2.5 rounded-lg font-semibold text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 cursor-pointer min-h-[44px]"
                  >
                    <IconArrowLeft />
                    <span>7.3'e Dön</span>
                  </button>
                  <button
                    type="button"
                    onClick={onReset}
                    className="flex items-center gap-2 px-6 py-2.5 rounded-lg font-semibold text-sm bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 cursor-pointer min-h-[44px]"
                  >
                    <span>1. Adıma Dön (Yeni Hesaplama)</span>
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      function BruttenNeteModulu() {
        const [activeStep, setActiveStep] = useState(1);
        const [grossSalary, setGrossSalary] = useState(30000);
        const [grossSalaryHam, setGrossSalaryHam] = useState('30000');
        const [firmaTuru, setFirmaTuru] = useState('uretim');
        const [isVergiDilimiStepDone, setIsVergiDilimiStepDone] = useState(false);
        const [isAsgariUcretStepDone, setIsAsgariUcretStepDone] = useState(false);
        const [inputs, setInputs] = useState({
          sgkWorkerInput: '',
          unemploymentInput: '',
          taxBaseInput: '',
          incomeTaxInput: '',
          stampTaxInput: '',
          netSalaryInput: '',
          sgkEmployerInput: '',
          employerUnemploymentInput: '',
          totalEmployerCostInput: '',
        });

        const parseGirdi = parseSayiGirdisi;

        const seciliSektor = ISVEREN_SEKTORLERI[firmaTuru];
        const digerSektorKey = firmaTuru === 'uretim' ? 'hizmet' : 'uretim';
        const digerSektor = ISVEREN_SEKTORLERI[digerSektorKey];

        const correctSgkWorker = Math.round(grossSalary * 0.14 * 100) / 100;
        const correctUnemployment = Math.round(grossSalary * 0.01 * 100) / 100;
        const correctTaxBase = Math.round((grossSalary - correctSgkWorker - correctUnemployment) * 100) / 100;
        const correctIncomeTax = Math.round(correctTaxBase * 0.15 * 100) / 100;
        const correctStampTax = Math.round(grossSalary * 0.00759 * 100) / 100;
        const correctNetSalary = Math.round((grossSalary - correctSgkWorker - correctUnemployment - correctIncomeTax - correctStampTax) * 100) / 100;

        const grossKurus = toKurus(grossSalary);
        const correctSgkEmployer = fromKurus(Math.round(grossKurus * seciliSektor.sgkIsverenOran));
        const correctEmployerUnemployment = fromKurus(Math.round(grossKurus * seciliSektor.issizlikIsverenOran));
        const correctTotalEmployerCost = fromKurus(
          grossKurus + toKurus(correctSgkEmployer) + toKurus(correctEmployerUnemployment)
        );

        const digerSgkEmployer = fromKurus(Math.round(grossKurus * digerSektor.sgkIsverenOran));
        const digerTotalEmployerCost = fromKurus(
          grossKurus + toKurus(digerSgkEmployer) + toKurus(correctEmployerUnemployment)
        );
        const sektorFarkiTL = Math.abs(Math.round((correctTotalEmployerCost - digerTotalEmployerCost) * 100) / 100);

        const isSgkWorkerCorrect = inputs.sgkWorkerInput !== '' && Math.abs(parseGirdi(inputs.sgkWorkerInput) - correctSgkWorker) < 1;
        const isUnemploymentCorrect = inputs.unemploymentInput !== '' && Math.abs(parseGirdi(inputs.unemploymentInput) - correctUnemployment) < 1;
        const isTaxBaseCorrect = inputs.taxBaseInput !== '' && Math.abs(parseGirdi(inputs.taxBaseInput) - correctTaxBase) < 1;
        const isIncomeTaxCorrect = inputs.incomeTaxInput !== '' && Math.abs(parseGirdi(inputs.incomeTaxInput) - correctIncomeTax) < 1;
        const isStampTaxCorrect = inputs.stampTaxInput !== '' && Math.abs(parseGirdi(inputs.stampTaxInput) - correctStampTax) < 1;
        const isNetSalaryCorrect = inputs.netSalaryInput !== '' && Math.abs(parseGirdi(inputs.netSalaryInput) - correctNetSalary) < 1;

        const isSgkEmployerCorrect = inputs.sgkEmployerInput !== '' && Math.abs(parseGirdi(inputs.sgkEmployerInput) - correctSgkEmployer) < 0.5;
        const isEmployerUnemploymentCorrect = inputs.employerUnemploymentInput !== '' && Math.abs(parseGirdi(inputs.employerUnemploymentInput) - correctEmployerUnemployment) < 0.5;
        const isTotalEmployerCostCorrect = inputs.totalEmployerCostInput !== '' && Math.abs(parseGirdi(inputs.totalEmployerCostInput) - correctTotalEmployerCost) < 0.5;
        const isEmployerStepDone = isSgkEmployerCorrect && isEmployerUnemploymentCorrect && isTotalEmployerCostCorrect;

        const handleInputChange = (field, value) => {
          setInputs(prev => ({ ...prev, [field]: value }));
        };

        const handleFirmaTuruChange = (yeniTur) => {
          if (yeniTur === firmaTuru) return;
          setFirmaTuru(yeniTur);
          setInputs(prev => ({
            ...prev,
            sgkEmployerInput: '',
            totalEmployerCostInput: '',
          }));
        };

        const resetAllInputs = () => {
          setInputs({
            sgkWorkerInput: '',
            unemploymentInput: '',
            taxBaseInput: '',
            incomeTaxInput: '',
            stampTaxInput: '',
            netSalaryInput: '',
            sgkEmployerInput: '',
            employerUnemploymentInput: '',
            totalEmployerCostInput: '',
          });
        };

        const handleGrossChange = (ham) => {
          setGrossSalaryHam(ham);
          const parsed = parseSayiGirdisi(ham);
          const safe = Number.isFinite(parsed) && parsed >= 0 ? parsed : 0;
          setGrossSalary(safe);
          resetAllInputs();
        };

        return (
          <div className="flex flex-col gap-6">
            {/* Üst Özet Akış Barı */}
            <div className="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 overflow-x-auto">
              <div className="flex items-center gap-2 min-w-max text-xs font-mono tabular-nums">
                <div className="flex items-center gap-1.5 bg-sky-950/60 border border-sky-500/40 px-3 py-1.5 rounded-lg text-sky-200">
                  <span className="font-sans font-semibold">Brüt:</span>
                  <span className="font-bold text-white">{formatTL(grossSalary)}</span>
                </div>
                <IconChevronRight />
                <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${activeStep >= 1 ? (isSgkWorkerCorrect ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-200' : 'bg-slate-950 border-slate-800 text-slate-300') : 'bg-slate-950/50 border-slate-800 text-slate-500'}`}>
                  <span className="font-sans">- SGK (%14):</span>
                  <span className="font-bold">{isSgkWorkerCorrect ? formatTL(correctSgkWorker) : '...'}</span>
                </div>
                <IconChevronRight />
                <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${activeStep >= 1 ? (isUnemploymentCorrect ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-200' : 'bg-slate-950 border-slate-800 text-slate-300') : 'bg-slate-950/50 border-slate-800 text-slate-500'}`}>
                  <span className="font-sans">- İşsizlik (%1):</span>
                  <span className="font-bold">{isUnemploymentCorrect ? formatTL(correctUnemployment) : '...'}</span>
                </div>
                <IconChevronRight />
                <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${activeStep >= 2 ? (isTaxBaseCorrect ? 'bg-indigo-950/60 border-indigo-500/50 text-indigo-200' : 'bg-slate-950 border-slate-800 text-slate-300') : 'bg-slate-950/50 border-slate-800 text-slate-500'}`}>
                  <span className="font-sans">GV Matrahı:</span>
                  <span className="font-bold">{isTaxBaseCorrect ? formatTL(correctTaxBase) : '...'}</span>
                </div>
                <IconChevronRight />
                <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${activeStep >= 2 ? (isIncomeTaxCorrect ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-200' : 'bg-slate-950 border-slate-800 text-slate-300') : 'bg-slate-950/50 border-slate-800 text-slate-500'}`}>
                  <span className="font-sans">- Gelir V. (%15):</span>
                  <span className="font-bold">{isIncomeTaxCorrect ? formatTL(correctIncomeTax) : '...'}</span>
                </div>
                <IconChevronRight />
                <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${activeStep >= 3 ? (isStampTaxCorrect ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-200' : 'bg-slate-950 border-slate-800 text-slate-300') : 'bg-slate-950/50 border-slate-800 text-slate-500'}`}>
                  <span className="font-sans">- Damga (0.00759):</span>
                  <span className="font-bold">{isStampTaxCorrect ? formatTL(correctStampTax) : '...'}</span>
                </div>
                <IconChevronRight />
                <div className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg border font-bold ${activeStep >= 3 && isNetSalaryCorrect ? 'bg-emerald-600 text-white border-emerald-400' : 'bg-slate-950 border-slate-800 text-slate-300'}`}>
                  <span className="font-sans">Net Ücret:</span>
                  <span>{activeStep >= 3 && isNetSalaryCorrect ? formatTL(correctNetSalary) : 'Hesaplanıyor...'}</span>
                </div>
                <span className="text-slate-700 px-1">|</span>
                <div className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg border font-bold ${isEmployerStepDone ? 'bg-amber-600 text-white border-amber-400' : 'bg-slate-950 border-slate-800 text-slate-300'}`}>
                  <span className="font-sans">İşveren ({seciliSektor.kisaAd}):</span>
                  <span>{isEmployerStepDone ? formatTL(correctTotalEmployerCost) : '...'}</span>
                </div>
                <span className="text-slate-700 px-1">|</span>
                <div className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg border font-bold ${isVergiDilimiStepDone ? 'bg-sky-600 text-white border-sky-400' : 'bg-slate-950 border-slate-800 text-slate-300'}`}>
                  <span className="font-sans">Vergi Dilimi:</span>
                  <span>{isVergiDilimiStepDone ? 'Tamamlandı' : '4 İşlem Pratik'}</span>
                </div>
                <span className="text-slate-700 px-1">|</span>
                <div className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg border font-bold ${isAsgariUcretStepDone ? 'bg-indigo-600 text-white border-indigo-400' : 'bg-slate-950 border-slate-800 text-slate-300'}`}>
                  <span className="font-sans">Asgari Ücret İstisnası:</span>
                  <span>{isAsgariUcretStepDone ? 'Tamamlandı' : 'Eğitim + Sınav'}</span>
                </div>
              </div>
            </div>

            {/* Adım Seçim Sekmeleri (7 Adım) */}
            <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2.5">
              {[
                { step: 1, title: '1. Brüt ve SGK', desc: 'Brüt Ücret ve İşçi SGK' },
                { step: 2, title: '2. Matrah ve GV', desc: 'Matrah ve %15 Gelir V.' },
                { step: 3, title: '3. Damga ve Net', desc: 'Damga ve Net Ücret' },
                { step: 4, title: '4. Bordro Özeti', desc: 'Standart Bordro Karnesi' },
                { step: 5, title: '5. İşveren Maliyeti', desc: 'Üretim / Hizmet Seçimi' },
                { step: 6, title: '6. Vergi Dilimi', desc: 'Kümülatif & Dilim Pratiği' },
                { step: 7, title: '7. Asgari İstisna', desc: 'GV & Damga İstisnası' },
              ].map((item) => {
                const done =
                  (item.step === 1 && isSgkWorkerCorrect && isUnemploymentCorrect) ||
                  (item.step === 2 && isTaxBaseCorrect && isIncomeTaxCorrect) ||
                  (item.step === 3 && isStampTaxCorrect && isNetSalaryCorrect) ||
                  (item.step === 5 && isEmployerStepDone) ||
                  (item.step === 6 && isVergiDilimiStepDone) ||
                  (item.step === 7 && isAsgariUcretStepDone);
                return (
                  <button
                    key={item.step}
                    onClick={() => setActiveStep(item.step)}
                    className={`p-3 rounded-xl border text-left transition-colors flex flex-col gap-1 cursor-pointer min-h-[44px] ${
                      activeStep === item.step
                        ? 'bg-slate-800 border-sky-500 text-white'
                        : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2 text-xs text-slate-400">
                      <span>Adım {item.step} / 7</span>
                      {done && <IconCheck />}
                    </div>
                    <div className="font-semibold text-xs sm:text-sm text-white truncate">{item.title}</div>
                    <div className="text-[11px] text-slate-400 truncate">{item.desc}</div>
                  </button>
                );
              })}
            </div>

            {/* ADIM 1 */}
            {activeStep === 1 && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 sm:p-8 flex flex-col gap-6">
                <div className="border-b border-slate-800 pb-5">
                  <div className="text-xs text-sky-400 font-medium">Adım 1 / 7 · Sosyal Güvenlik Kesintileri</div>
                  <h2 className="text-xl sm:text-2xl font-bold text-white mt-1">Brüt Ücret Girişi ve SGK Kesintileri</h2>
                  <p className="text-sm text-slate-300 mt-1 max-w-3xl">
                    Öncelikle hesaplama yapmak istediğiniz brüt ücret tutarını girin. Ardından %14 SGK işçi primi ve %1 işsizlik sigortası primini hesaplayıp ilgili kutulara yazın.
                  </p>
                </div>

                <div className="bg-slate-950 border border-slate-800 rounded-xl p-5">
                  <label htmlFor="brut-input" className="block text-xs font-semibold text-slate-300 mb-2">
                    Hesaplanacak Brüt Ücret Tutarı (TL)
                  </label>
                  <div className="relative max-w-md">
                    <input
                      id="brut-input"
                      type="text"
                      inputMode="decimal"
                      value={grossSalaryHam}
                      onChange={(e) => handleGrossChange(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white font-mono tabular-nums font-bold text-xl text-right pr-12 focus:outline-none focus:ring-2 focus:ring-sky-500 min-h-[44px]"
                    />
                    <span className="absolute right-4 top-3.5 text-slate-400 font-mono text-sm">TL</span>
                  </div>
                  <div className="text-xs text-slate-400 font-mono mt-1.5">
                    Tanınan brüt ücret: {formatTL(grossSalary)}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className={`bg-slate-950 border rounded-xl p-5 flex flex-col justify-between transition-colors ${
                    inputs.sgkWorkerInput === ''
                      ? 'border-slate-800'
                      : isSgkWorkerCorrect
                        ? 'border-emerald-500/70 bg-emerald-950/20'
                        : 'border-rose-500/70 bg-rose-950/20'
                  }`}>
                    <div>
                      <div className="flex items-center justify-between">
                        <span className="text-sm font-semibold text-slate-100">%14 SGK İşçi Primi</span>
                        {inputs.sgkWorkerInput !== '' && (isSgkWorkerCorrect ? <IconCheck /> : <IconX />)}
                      </div>
                      <p className="text-xs text-slate-400 mt-1 font-mono">Formül: Brüt Ücret × 0,14</p>
                    </div>
                    <div className="mt-4 flex flex-col gap-2">
                      <div className="relative">
                        <input
                          type="text"
                          inputMode="decimal"
                          placeholder="Tutar giriniz..."
                          value={inputs.sgkWorkerInput}
                          onChange={(e) => handleInputChange('sgkWorkerInput', e.target.value)}
                          className={`w-full bg-slate-900 border rounded-lg px-3 py-2.5 font-mono tabular-nums font-bold text-right pr-10 focus:outline-none focus:ring-2 min-h-[44px] ${
                            inputs.sgkWorkerInput === ''
                              ? 'border-slate-700 text-white focus:ring-sky-500'
                              : isSgkWorkerCorrect
                                ? 'border-emerald-500 focus:ring-emerald-500 text-emerald-300'
                                : 'border-rose-500 focus:ring-rose-500 text-rose-300'
                          }`}
                        />
                        <span className="absolute right-3 top-3 text-slate-400 text-xs font-mono">TL</span>
                      </div>
                      {inputs.sgkWorkerInput !== '' && !isSgkWorkerCorrect && (
                        <span className="text-xs text-rose-400 font-medium flex items-center gap-1.5">
                          <IconInfo /> Hatalı hesaplama. İpucu: Brüt tutarın %14'ünü hesaplayın.
                        </span>
                      )}
                      {isSgkWorkerCorrect && (
                        <span className="text-xs text-emerald-400 font-medium flex items-center gap-1.5">
                          <IconCheck /> Doğru hesapladınız.
                        </span>
                      )}
                    </div>
                  </div>

                  <div className={`bg-slate-950 border rounded-xl p-5 flex flex-col justify-between transition-colors ${
                    inputs.unemploymentInput === ''
                      ? 'border-slate-800'
                      : isUnemploymentCorrect
                        ? 'border-emerald-500/70 bg-emerald-950/20'
                        : 'border-rose-500/70 bg-rose-950/20'
                  }`}>
